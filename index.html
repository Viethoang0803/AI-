<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
    />
    <title>Dòng Hạt Đồng Bộ Tay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --accent: #00f2ff;
        --freeze: #ff4d4d;
        --morph: #a855f7;
        --shrink: #4ade80;
        --snap: #fbbf24;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(
          circle at 50% 50%,
          #0d1117 0%,
          #000000 100%
        );
        font-family: "Inter", sans-serif;
        color: white;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        pointer-events: none;
        max-width: min(92vw, 420px);
      }

      #info h1 {
        font-weight: 700;
        margin: 0 0 12px;
        font-size: clamp(1.35rem, 5.5vw, 2.3rem);
        background: white;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1.15;
      }

      #info p {
        font-size: clamp(0.52rem, 2.3vw, 0.72rem);
        margin: 0;
        letter-spacing: 0.6px;
        line-height: 1.75;
        text-transform: uppercase;
        font-weight: 500;
      }

      #info b {
        color: var(--accent);
        background: rgba(0, 242, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(0, 242, 255, 0.22);
        margin: 0 2px;
        font-size: 0.92em;
      }

      #shape-display {
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: right;
        z-index: 10;
        pointer-events: none;
        max-width: 42%;
      }

      #shape-label {
        font-size: clamp(0.5rem, 2vw, 0.7rem);
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.5;
        margin-bottom: 2px;
      }

      #current-shape-name {
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        text-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        line-height: 1.2;
        word-break: break-word;
      }

      #status-hint {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 10;
        font-size: clamp(0.55rem, 2.1vw, 0.7rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
        pointer-events: none;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }

      #webcam-feed {
        display: block;
        position: absolute;
        bottom: 15px;
        right: 15px;
        width: clamp(120px, 30vw, 240px);
        height: auto;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        transform: scaleX(-1);
        z-index: 5;
        background: #222;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--accent);
        letter-spacing: 1px;
        font-size: clamp(0.7rem, 3vw, 0.9rem);
        text-transform: uppercase;
        text-align: center;
        padding: 0 20px;
        width: 80%;
        z-index: 20;
      }

      @media (max-width: 480px) {
        #info {
          top: 8px;
          left: 8px;
          max-width: 58vw;
        }
        #info h1 {
          font-size: 1.05rem;
          margin-bottom: 6px;
        }
        #shape-display {
          top: 8px;
          right: 8px;
          max-width: 36%;
        }
        #webcam-feed {
          bottom: 8px;
          right: 8px;
          width: clamp(84px, 20vw, 130px);
        }
        #info p {
          line-height: 1.45;
          letter-spacing: 0.3px;
          font-size: 0.48rem;
        }
        #status-hint {
          bottom: 10px;
          font-size: 0.5rem;
          white-space: normal;
          text-align: center;
          max-width: 90vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>Dòng Hạt Đồng Bộ</h1>
      <p>
        🖐️ <b>XÒE + DI CHUYỂN</b> → <span style="opacity: 0.6">XOAY 360° (mọi cỡ)</span><br />
        ✊ <b>NẮM GIỮ</b> → <span style="opacity: 0.6">THU NHỎ</span><br />
        🤟 <b>3 NGÓN GIỮ</b> → <span style="opacity: 0.6">PHÓNG TO</span><br />
        ✌️ <b>2 NGÓN GIỮ</b> → <span style="opacity: 0.6">CỠ VỪA</span><br />
        🤏 <b>CHỤM CÁI+TRỎ</b> → <span style="opacity: 0.6">ĐỔI HÌNH</span><br />
        ✊ <b>CHỤM HẾT NGÓN · TÍCH · MỞ</b> → <span style="opacity: 0.6">VỠ TUNG</span><br />
        ☝️ <b>1 NGÓN</b> → <span style="opacity: 0.6">ĐÓNG BĂNG</span>
      </p>
    </div>

    <div id="shape-display">
      <div id="shape-label">Hình hiện tại</div>
      <div id="current-shape-name">Quả cầu</div>
    </div>

    <div id="status-hint">Đưa tay vào khung webcam</div>
    <div id="loading">Đang khởi tạo…</div>
    <video id="webcam-feed" autoplay playsinline muted></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>

    <script>
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const PARTICLE_COUNT = isMobile ? 10000 : 20000;

      let currentShape = "sphere";
      const shapeList = [
        "sphere",
        "heart",
        "star",
        "cat",
        "bunny",
        "moon",
        "flower",
        "saturn",
        "smile",
      ];
      const shapeNamesVi = {
        sphere: "Quả cầu",
        heart: "Trái tim",
        star: "Ngôi sao",
        cat: "Con mèo",
        bunny: "Thỏ con",
        moon: "Mặt trăng",
        flower: "Bông hoa",
        saturn: "Sao Thổ",
        smile: "Mặt cười",
      };
      let shapeIndex = 0;

      let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
      let explodeVel = new Float32Array(PARTICLE_COUNT * 3);

      let palmX = 0,
        palmY = 0;
      let prevPalmX = 0,
        prevPalmY = 0;
      let hasPrevPalm = false;
      let rotY = 0,
        rotX = 0;

      let isPinching = false;
      let pinchHoldMs = 0;
      let lastPinchFrame = 0;
      let lastMorphTime = 0;

      let isFist = false;
      let isOpenPalm = false;
      let isFrozen = false;
      let canRotate = false;

      // Chụm tất cả ngón → tích năng lượng → xòe ra = nổ
      let explodeCharging = false;
      let explodeChargeMs = 0;
      let explodeReady = false;
      const EXPLODE_CHARGE_MS = 700;
      let lastSnapTime = 0;
      let exploding = false;
      let explodeUntil = 0;

      // Scale theo viewport — vừa khung, phóng to không tràn màn hình
      const SCALE_HOLD_MS = 420;
      let scaleLimits = { fit: 0.85, small: 0.36, big: 1.25 };
      let scaleMode = "fit"; // fit | small | big
      let scaleTarget = scaleLimits.fit;
      let scalePending = null;
      let scaleHoldMs = 0;
      let lastFrameTime = performance.now();

      const colorObj = new THREE.Color();
      const tmpScale = new THREE.Vector3(1, 1, 1);
      const statusHint = document.getElementById("status-hint");
      const shapeNameEl = document.getElementById("current-shape-name");
      const videoElement = document.getElementById("webcam-feed");

      const shapeHue = {
        sphere: 0.55,
        heart: 0.95,
        star: 0.14,
        cat: 0.08,
        bunny: 0.9,
        moon: 0.6,
        flower: 0.82,
        saturn: 0.12,
        smile: 0.14,
      };

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2)
      );
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      function scaleValueForMode(mode) {
        if (mode === "small") return scaleLimits.small;
        if (mode === "big") return scaleLimits.big;
        return scaleLimits.fit;
      }

      function updateViewportScale() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        // Portrait phone: wider FOV so shape fits vertical frame
        camera.fov = h > w ? (isMobile ? 68 : 62) : isMobile ? 58 : 55;
        camera.updateProjectionMatrix();

        const vFOV = THREE.MathUtils.degToRad(camera.fov);
        const visibleH = 2 * Math.tan(vFOV / 2) * camera.position.z;
        const visibleW = visibleH * camera.aspect;
        const shapeR = 4.3; // max shape radius in local units
        const minSide = Math.min(visibleW, visibleH);
        // fit: ~84% khung · big: ~96% (không tràn) · small: ~40% fit
        scaleLimits.fit = (minSide * 0.84) / (shapeR * 2);
        scaleLimits.big = (minSide * 0.96) / (shapeR * 2);
        scaleLimits.small = scaleLimits.fit * 0.42;
        scaleTarget = scaleValueForMode(scaleMode);
      }

      updateViewportScale();

      function createHardCircleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.5, "rgba(255,255,255,0.9)");
        gradient.addColorStop(0.8, "rgba(255,255,255,0.1)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 20;
        colors[i] = 1;
      }
      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
      );
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: isMobile ? 0.15 : 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: createHardCircleTexture(),
      });

      const particles = new THREE.Points(geometry, material);
      particles.scale.setScalar(scaleLimits.fit);
      scene.add(particles);

      function dist2(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function inCircle(cx, cy, r) {
        const a = Math.random() * Math.PI * 2;
        const rad = Math.sqrt(Math.random()) * r;
        return [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, (Math.random() - 0.5) * 0.8];
      }

      // --- Shape math ---
      const shapes = {
        sphere: (i) => {
          const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
          const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
          return [
            4 * Math.cos(theta) * Math.sin(phi),
            4 * Math.sin(theta) * Math.sin(phi),
            4 * Math.cos(phi),
          ];
        },
        heart: (i) => {
          const t = Math.random() * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);
          return [x * 0.25, y * 0.25, (Math.random() - 0.5) * 1.6];
        },
        star: (i) => {
          // 5-point star outline + soft fill
          if (i < PARTICLE_COUNT * 0.55) {
            const t = Math.random() * Math.PI * 2;
            const spikes = 5;
            const r =
              2.2 +
              1.8 *
                Math.pow(
                  Math.abs(Math.cos((spikes * t) / 2)),
                  1.2
                );
            return [
              r * Math.cos(t),
              r * Math.sin(t),
              (Math.random() - 0.5) * 0.9,
            ];
          }
          return inCircle(0, 0, 1.4);
        },
        cat: (i) => {
          // Full cat: head + ears + body + legs + tail
          const n = PARTICLE_COUNT;
          const r = i / n;
          if (r < 0.28) {
            // head
            return inCircle(0, 1.55, 1.45);
          } else if (r < 0.34) {
            // left ear
            const t = Math.random();
            return [
              -0.95 + t * 0.7 + (Math.random() - 0.5) * 0.15,
              2.6 + t * 1.35,
              (Math.random() - 0.5) * 0.4,
            ];
          } else if (r < 0.4) {
            // right ear
            const t = Math.random();
            return [
              0.95 - t * 0.7 + (Math.random() - 0.5) * 0.15,
              2.6 + t * 1.35,
              (Math.random() - 0.5) * 0.4,
            ];
          } else if (r < 0.44) {
            return inCircle(-0.45, 1.65, 0.22);
          } else if (r < 0.48) {
            return inCircle(0.45, 1.65, 0.22);
          } else if (r < 0.72) {
            // oval body
            const a = Math.random() * Math.PI * 2;
            const rad = Math.sqrt(Math.random());
            return [
              Math.cos(a) * rad * 1.55,
              -0.35 + Math.sin(a) * rad * 1.15,
              (Math.random() - 0.5) * 1.1,
            ];
          } else if (r < 0.78) {
            // front left leg
            return [
              -0.7 + (Math.random() - 0.5) * 0.35,
              -1.5 - Math.random() * 1.3,
              0.35 + (Math.random() - 0.5) * 0.3,
            ];
          } else if (r < 0.84) {
            // front right leg
            return [
              0.7 + (Math.random() - 0.5) * 0.35,
              -1.5 - Math.random() * 1.3,
              0.35 + (Math.random() - 0.5) * 0.3,
            ];
          } else if (r < 0.9) {
            // back left leg
            return [
              -0.55 + (Math.random() - 0.5) * 0.3,
              -1.35 - Math.random() * 1.15,
              -0.45 + (Math.random() - 0.5) * 0.3,
            ];
          } else if (r < 0.96) {
            // back right leg
            return [
              0.55 + (Math.random() - 0.5) * 0.3,
              -1.35 - Math.random() * 1.15,
              -0.45 + (Math.random() - 0.5) * 0.3,
            ];
          } else {
            // curved tail
            const t = Math.random();
            const ang = t * Math.PI * 0.9;
            return [
              1.3 + Math.sin(ang) * 1.6,
              -0.2 + Math.cos(ang) * 1.1 - t * 0.4,
              -0.6 + (Math.random() - 0.5) * 0.35,
            ];
          }
        },
        bunny: (i) => {
          const n = PARTICLE_COUNT;
          if (i < n * 0.5) {
            return inCircle(0, -0.6, 2.4);
          } else if (i < n * 0.72) {
            // left long ear
            const t = Math.random();
            return [
              -0.9 + (Math.random() - 0.5) * 0.7,
              0.8 + t * 3.4,
              (Math.random() - 0.5) * 0.5,
            ];
          } else if (i < n * 0.94) {
            // right long ear
            const t = Math.random();
            return [
              0.9 + (Math.random() - 0.5) * 0.7,
              0.8 + t * 3.4,
              (Math.random() - 0.5) * 0.5,
            ];
          } else {
            // nose
            return inCircle(0, -0.7, 0.28);
          }
        },
        moon: (i) => {
          // Crescent: outer disk minus offset disk
          for (let tries = 0; tries < 8; tries++) {
            const a = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * 3.6;
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r;
            const dx = x - 1.35;
            const dy = y - 0.15;
            if (dx * dx + dy * dy > 2.9 * 2.9) {
              return [x, y, (Math.random() - 0.5) * 1.1];
            }
          }
          return [3.2, 0, 0];
        },
        flower: (i) => {
          const u = Math.random() * Math.PI * 2;
          const v = Math.random() * Math.PI;
          const r = 3 + Math.sin(5 * u) * Math.sin(5 * v);
          return [
            r * Math.sin(v) * Math.cos(u),
            r * Math.sin(v) * Math.sin(u),
            r * Math.cos(v),
          ];
        },
        saturn: (i) => {
          if (i < PARTICLE_COUNT * 0.55) {
            const phi = Math.acos(-1 + (2 * i) / (PARTICLE_COUNT * 0.55));
            const theta = Math.sqrt(PARTICLE_COUNT * 0.55 * Math.PI) * phi;
            return [
              2.4 * Math.cos(theta) * Math.sin(phi),
              2.4 * Math.sin(theta) * Math.sin(phi),
              2.4 * Math.cos(phi),
            ];
          }
          const angle = Math.random() * Math.PI * 2;
          const r = 4.2 + Math.random() * 1.8;
          return [
            r * Math.cos(angle),
            (Math.random() - 0.5) * 0.28,
            r * Math.sin(angle),
          ];
        },
        smile: (i) => {
          const n = PARTICLE_COUNT;
          if (i < n * 0.62) {
            return inCircle(0, 0, 3.2);
          } else if (i < n * 0.74) {
            return inCircle(-1.1, 0.7, 0.38);
          } else if (i < n * 0.86) {
            return inCircle(1.1, 0.7, 0.38);
          } else {
            // smile arc
            const t = Math.PI * 0.15 + Math.random() * Math.PI * 0.7;
            return [
              Math.cos(t) * 1.7,
              -0.3 - Math.sin(t) * 1.35,
              (Math.random() - 0.5) * 0.5,
            ];
          }
        },
      };

      function getTargetPositions(shapeName) {
        const arr = new Float32Array(PARTICLE_COUNT * 3);
        const fn = shapes[shapeName] || shapes.sphere;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const [x, y, z] = fn(i);
          arr[i * 3] = x;
          arr[i * 3 + 1] = y;
          arr[i * 3 + 2] = z;
        }
        return arr;
      }

      function applyShapeColors() {
        const colAttr = particles.geometry.attributes.color;
        const base = shapeHue[currentShape] || 0.5;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const ix = i * 3;
          const dist = Math.hypot(
            targetPositions[ix],
            targetPositions[ix + 1],
            targetPositions[ix + 2]
          );
          colorObj.setHSL((base + dist * 0.045) % 1, 0.8, 0.6);
          colAttr.array[ix] = colorObj.r;
          colAttr.array[ix + 1] = colorObj.g;
          colAttr.array[ix + 2] = colorObj.b;
        }
        colAttr.needsUpdate = true;
      }

      function setShape(index) {
        shapeIndex = ((index % shapeList.length) + shapeList.length) % shapeList.length;
        currentShape = shapeList[shapeIndex];
        shapeNameEl.innerText = shapeNamesVi[currentShape] || currentShape;
        targetPositions = getTargetPositions(currentShape);
        applyShapeColors();
      }

      function cycleShape() {
        const now = Date.now();
        if (now - lastMorphTime < 1200) return;
        if (exploding) return;
        setShape(shapeIndex + 1);
        lastMorphTime = now;
        statusHint.textContent = "Đổi hình · " + shapeNamesVi[currentShape];
      }

      function triggerExplode() {
        const now = Date.now();
        if (now - lastSnapTime < 2000) return;
        lastSnapTime = now;
        explodeCharging = false;
        explodeChargeMs = 0;
        explodeReady = false;
        exploding = true;
        explodeUntil = now + 2200;
        const pos = particles.geometry.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const ix = i * 3;
          const x = pos[ix];
          const y = pos[ix + 1];
          const z = pos[ix + 2];
          const len = Math.hypot(x, y, z) || 1;
          const power = 0.18 + Math.random() * 0.35;
          explodeVel[ix] = (x / len) * power + (Math.random() - 0.5) * 0.08;
          explodeVel[ix + 1] = (y / len) * power + (Math.random() - 0.5) * 0.08;
          explodeVel[ix + 2] = (z / len) * power + (Math.random() - 0.5) * 0.08;
        }
        statusHint.textContent = "Bùng nổ!";
        videoElement.style.borderColor = "var(--snap)";
        videoElement.style.boxShadow = "0 0 28px rgba(251, 191, 36, 0.65)";
      }

      function tipClusterSpread(lm) {
        const tips = [lm[4], lm[8], lm[12], lm[16], lm[20]];
        let cx = 0,
          cy = 0;
        for (const t of tips) {
          cx += t.x;
          cy += t.y;
        }
        cx /= 5;
        cy /= 5;
        let s = 0;
        for (const t of tips) s += Math.hypot(t.x - cx, t.y - cy);
        return s / 5;
      }

      targetPositions = getTargetPositions(currentShape);
      applyShapeColors();

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: isMobile ? 0 : 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65,
      });

      hands.onResults((results) => {
        document.getElementById("loading").style.display = "none";
        const now = performance.now();
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        if (
          !results.multiHandLandmarks ||
          results.multiHandLandmarks.length === 0
        ) {
          isFrozen = false;
          isPinching = false;
          pinchHoldMs = 0;
          isFist = false;
          isOpenPalm = false;
          canRotate = false;
          explodeCharging = false;
          explodeChargeMs = 0;
          explodeReady = false;
          hasPrevPalm = false;
          scalePending = null;
          scaleHoldMs = 0;
          statusHint.textContent = "Đưa tay vào khung webcam";
          videoElement.style.borderColor = "rgba(255, 255, 255, 0.5)";
          videoElement.style.boxShadow = "none";
          return;
        }

        const lm = results.multiHandLandmarks[0];

        // Stable palm point for rotation (middle MCP)
        palmX = (1 - lm[9].x) * 2 - 1;
        palmY = (1 - lm[9].y) * 2 - 1;

        const indexUp = lm[8].y < lm[6].y;
        const middleUp = lm[12].y < lm[10].y;
        const ringUp = lm[16].y < lm[14].y;
        const pinkyUp = lm[20].y < lm[18].y;
        const fingersUp =
          (indexUp ? 1 : 0) +
          (middleUp ? 1 : 0) +
          (ringUp ? 1 : 0) +
          (pinkyUp ? 1 : 0);
        const fingersDown = 4 - fingersUp;

        const thumbIndex = dist2(lm[4], lm[8]);
        const handSpeed = hasPrevPalm
          ? Math.hypot(palmX - prevPalmX, palmY - prevPalmY)
          : 0;
        const cluster = tipClusterSpread(lm);

        // --- Gesture priority ---
        // 1) Vỡ tung: CHỤM TẤT CẢ ngón (cụm đầu ngón) → tích ~0.7s → XÒE ra
        const allFingersBunched =
          cluster < 0.048 && fingersDown >= 3 && handSpeed < 0.04;

        isOpenPalm = fingersUp >= 4 && thumbIndex > 0.08 && cluster > 0.09;

        if (!exploding && allFingersBunched) {
          explodeCharging = true;
          explodeChargeMs += dt * 1000;
          if (explodeChargeMs >= EXPLODE_CHARGE_MS) {
            explodeReady = true;
            explodeChargeMs = EXPLODE_CHARGE_MS;
          }
        } else if (explodeReady && isOpenPalm) {
          triggerExplode();
        } else if (!allFingersBunched && !isOpenPalm) {
          explodeCharging = false;
          explodeChargeMs = Math.max(0, explodeChargeMs - dt * 500);
          if (explodeChargeMs < 80) explodeReady = false;
        } else if (!allFingersBunched && explodeReady && !isOpenPalm) {
          // nhả không xòe hết → mất tích lũy chậm
          explodeChargeMs = Math.max(0, explodeChargeMs - dt * 300);
          if (explodeChargeMs < EXPLODE_CHARGE_MS * 0.5) explodeReady = false;
        }

        // 2) Morph: chụm cái+trỏ, 3 ngón kia co — không phải chụm cả bàn
        const morphPinch =
          !explodeCharging &&
          !explodeReady &&
          thumbIndex < 0.038 &&
          cluster > 0.055 &&
          fingersDown >= 3 &&
          !middleUp &&
          !ringUp &&
          !pinkyUp &&
          handSpeed < 0.035;

        if (morphPinch) {
          pinchHoldMs += dt * 1000;
          isPinching = true;
          if (pinchHoldMs > 280) {
            cycleShape();
            pinchHoldMs = -800;
          }
        } else {
          isPinching = false;
          pinchHoldMs = Math.max(0, pinchHoldMs - dt * 600);
        }

        // 3) Freeze: only index up
        isFrozen =
          indexUp &&
          !middleUp &&
          !ringUp &&
          !pinkyUp &&
          !isPinching &&
          !explodeCharging;

        // 4) Fist / open — xòe tay luôn được xoay (kể cả đang thu nhỏ)
        isFist =
          fingersDown >= 4 &&
          thumbIndex > 0.055 &&
          cluster > 0.05 &&
          !explodeCharging;
        canRotate =
          isOpenPalm && !isPinching && !exploding && !explodeCharging;

        // Scale sticky (xòe tay KHÔNG phóng to — chỉ xoay):
        // ✊ giữ → thu nhỏ · 🤟 3 ngón giữ → phóng to · ✌️ 2 ngón → cỡ vừa
        if (!isFrozen && !isPinching && !exploding && !explodeCharging) {
          let want = null;
          if (isFist && handSpeed < 0.022) want = "small";
          else if (
            fingersUp === 3 &&
            indexUp &&
            middleUp &&
            ringUp &&
            !pinkyUp &&
            handSpeed < 0.02
          ) {
            want = "big";
          } else if (
            fingersUp === 2 &&
            indexUp &&
            middleUp &&
            !ringUp &&
            !pinkyUp &&
            handSpeed < 0.02
          ) {
            want = "fit";
          }

          if (want && want !== scaleMode) {
            if (scalePending !== want) {
              scalePending = want;
              scaleHoldMs = 0;
            }
            scaleHoldMs += dt * 1000;
            if (scaleHoldMs >= SCALE_HOLD_MS) {
              scaleMode = want;
              scalePending = null;
              scaleHoldMs = 0;
            }
          } else if (!want) {
            scalePending = null;
            scaleHoldMs = 0;
          }
        }
        scaleTarget = scaleValueForMode(scaleMode);

        // 360° rotation at current size (small / fit / big)
        if (canRotate && hasPrevPalm) {
          rotY += (palmX - prevPalmX) * 3.2;
          rotX += (palmY - prevPalmY) * 2.6;
          rotX = THREE.MathUtils.clamp(rotX, -Math.PI * 0.85, Math.PI * 0.85);
        }

        prevPalmX = palmX;
        prevPalmY = palmY;
        hasPrevPalm = true;

        // Status + webcam border
        if (exploding) {
          statusHint.textContent = "Vỡ tung…";
          videoElement.style.borderColor = "var(--snap)";
          videoElement.style.boxShadow = "0 0 28px rgba(251, 191, 36, 0.65)";
        } else if (explodeCharging || explodeReady) {
          const pct = Math.round(
            (explodeChargeMs / EXPLODE_CHARGE_MS) * 100
          );
          statusHint.textContent = explodeReady
            ? "Đã tích đầy · XÒE TAY để nổ!"
            : "Đang tích năng lượng " + pct + "%…";
          videoElement.style.borderColor = "var(--snap)";
          videoElement.style.boxShadow = "0 0 22px rgba(251, 191, 36, 0.55)";
        } else if (isFrozen) {
          statusHint.textContent = "Đóng băng";
          videoElement.style.borderColor = "var(--freeze)";
          videoElement.style.boxShadow = "none";
        } else if (isPinching) {
          statusHint.textContent =
            pinchHoldMs > 0 ? "Giữ chụm để đổi hình…" : "Đổi hình";
          videoElement.style.borderColor = "var(--morph)";
          videoElement.style.boxShadow = "none";
        } else if (scalePending === "small") {
          statusHint.textContent = "Giữ nắm tay để thu nhỏ…";
          videoElement.style.borderColor = "var(--shrink)";
          videoElement.style.boxShadow = "0 0 18px rgba(74, 222, 128, 0.35)";
        } else if (scalePending === "big") {
          statusHint.textContent = "Giữ 3 ngón để phóng to…";
          videoElement.style.borderColor = "var(--accent)";
          videoElement.style.boxShadow = "0 0 18px rgba(0, 242, 255, 0.35)";
        } else if (scalePending === "fit") {
          statusHint.textContent = "Giữ 2 ngón để về cỡ vừa…";
          videoElement.style.borderColor = "rgba(255, 255, 255, 0.7)";
          videoElement.style.boxShadow = "none";
        } else if (isOpenPalm) {
          const sizeLabel =
            scaleMode === "small"
              ? "đang thu nhỏ"
              : scaleMode === "big"
                ? "đang phóng to"
                : "cỡ vừa";
          statusHint.textContent = "Xoay 360° · " + sizeLabel;
          videoElement.style.borderColor = "var(--accent)";
          videoElement.style.boxShadow = "0 0 26px rgba(0, 242, 255, 0.55)";
        } else if (isFist) {
          statusHint.textContent =
            scaleMode === "small"
              ? "Đã thu nhỏ · xòe tay để xoay"
              : "Nắm tay";
          videoElement.style.borderColor = "var(--shrink)";
          videoElement.style.boxShadow = "0 0 22px rgba(74, 222, 128, 0.45)";
        } else {
          statusHint.textContent =
            "Xòe xoay · nắm thu nhỏ · 3 ngón phóng to";
          videoElement.style.borderColor = "rgba(255, 255, 255, 0.5)";
          videoElement.style.boxShadow = "none";
        }

        lastPinchFrame = now;
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: isMobile ? 480 : 720,
        height: isMobile ? 320 : 480,
      });
      cameraUtils.start();

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        const now = Date.now();
        const posAttr = particles.geometry.attributes.position;

        tmpScale.set(scaleTarget, scaleTarget, scaleTarget);
        particles.scale.lerp(tmpScale, 0.08);

        // Smooth follow accumulated 360° rotation
        particles.rotation.y += (rotY - particles.rotation.y) * 0.18;
        particles.rotation.x += (rotX - particles.rotation.x) * 0.18;

        if (exploding) {
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ix = i * 3;
            posAttr.array[ix] += explodeVel[ix];
            posAttr.array[ix + 1] += explodeVel[ix + 1];
            posAttr.array[ix + 2] += explodeVel[ix + 2];
            explodeVel[ix] *= 0.985;
            explodeVel[ix + 1] *= 0.985;
            explodeVel[ix + 2] *= 0.985;
            explodeVel[ix + 1] -= 0.003; // slight gravity
          }
          posAttr.needsUpdate = true;
          if (now > explodeUntil) {
            exploding = false;
            statusHint.textContent = "Đang họp lại…";
          }
        } else if (!isFrozen) {
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ix = i * 3;
            posAttr.array[ix] +=
              (targetPositions[ix] - posAttr.array[ix]) * 0.08;
            posAttr.array[ix + 1] +=
              (targetPositions[ix + 1] - posAttr.array[ix + 1]) * 0.08;
            posAttr.array[ix + 2] +=
              (targetPositions[ix + 2] - posAttr.array[ix + 2]) * 0.08;

            posAttr.array[ix] += Math.sin(time * 0.5 + i) * 0.004;
            posAttr.array[ix + 1] += Math.cos(time * 0.5 + i) * 0.004;
          }
          posAttr.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateViewportScale();
        particles.scale.setScalar(scaleTarget);
      });

      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          renderer.setSize(window.innerWidth, window.innerHeight);
          updateViewportScale();
          particles.scale.setScalar(scaleTarget);
        }, 120);
      });

      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.scale !== 1) e.preventDefault();
        },
        { passive: false }
      );

      animate();
    </script>
  </body>
</html>
