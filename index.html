<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
    />
    <title>Dòng Hạt Đồng Bộ Tay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --accent: #00f2ff;
        --freeze: #ff4d4d;
        --morph: #a855f7;
        --shrink: #4ade80;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: "Inter", sans-serif;
        color: white;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      #webcam-feed {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        z-index: 0;
        background: #111;
      }

      #webcam-dim {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.45) 100%
        );
      }

      canvas {
        position: fixed !important;
        inset: 0;
        z-index: 2;
        display: block;
      }

      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        pointer-events: none;
        max-width: min(92vw, 22rem);
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
      }

      #info h1 {
        font-weight: 700;
        margin: 0 0 12px;
        font-size: clamp(1.35rem, 5vw, 2.1rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.15;
      }

      #info p {
        font-size: clamp(0.58rem, 2.3vw, 0.72rem);
        margin: 0;
        letter-spacing: 0.04em;
        line-height: 1.75;
        font-weight: 500;
        opacity: 0.95;
      }

      #info b {
        color: var(--accent);
        background: rgba(0, 242, 255, 0.12);
        padding: 2px 6px;
        border: 1px solid rgba(0, 242, 255, 0.25);
        margin: 0 2px;
        font-size: 0.92em;
      }

      #shape-display {
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: right;
        z-index: 10;
        pointer-events: none;
        max-width: 42%;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
      }

      #shape-label {
        font-size: clamp(0.5rem, 2vw, 0.68rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.55;
        margin-bottom: 2px;
      }

      #current-shape-name {
        font-size: clamp(1rem, 4vw, 1.45rem);
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: 0 0 20px rgba(0, 242, 255, 0.45);
        line-height: 1.2;
      }

      #status-hint {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 10;
        font-size: clamp(0.58rem, 2.2vw, 0.7rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        pointer-events: none;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        white-space: nowrap;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        color: var(--accent);
        letter-spacing: 0.08em;
        font-size: clamp(0.7rem, 3vw, 0.9rem);
        text-transform: uppercase;
        text-align: center;
        padding: 0 20px;
        width: 80%;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
      }

      @media (max-width: 640px) {
        #info { top: 12px; left: 12px; }
        #shape-display { top: 12px; right: 12px; }
        #info p { line-height: 1.55; }
      }
    </style>
  </head>
  <body>
    <video id="webcam-feed" autoplay playsinline muted></video>
    <div id="webcam-dim"></div>

    <div id="info">
      <h1>Dòng Hạt Đồng Bộ</h1>
      <p>
        👋 <b>NGỬA LÒNG BÀN TAY</b> → <span style="opacity: 0.65">HÌNH NẰM TRÊN TAY</span><br />
        🤏 <b>CHỤM</b> → <span style="opacity: 0.65">ĐỔI HÌNH</span><br />
        ✊ <b>NẮM TAY</b> → <span style="opacity: 0.65">PHÓNG TO</span><br />
        🖐️ <b>XÒE TAY</b> → <span style="opacity: 0.65">THU NHỎ</span><br />
        ☝️ <b>1 NGÓN</b> → <span style="opacity: 0.65">ĐÓNG BĂNG</span>
      </p>
    </div>

    <div id="shape-display">
      <div id="shape-label">Hình hiện tại</div>
      <div id="current-shape-name">Quả cầu</div>
    </div>

    <div id="status-hint">Đưa tay vào khung hình</div>
    <div id="loading">Đang khởi tạo camera…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>

    <script>
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const PARTICLE_COUNT = isMobile ? 10000 : 20000;

      const shapeList = ["sphere", "heart", "saturn", "flower", "fireworks"];
      const shapeNamesVi = {
        sphere: "Quả cầu",
        heart: "Trái tim",
        saturn: "Sao Thổ",
        flower: "Bông hoa",
        fireworks: "Pháo hoa",
      };

      let currentShape = "sphere";
      let shapeIndex = 0;
      let targetPositions = [];

      let handX = 0;
      let handY = 0;
      let isPinching = false;
      let isFist = false;
      let isOpenPalm = false;
      let isFrozen = false;
      let handDetected = false;
      let lastPinchTime = 0;
      let palmFacingUp = false; // lòng bàn tay hướng về camera / ngửa lên

      // Palm tracking — shape rests on palm surface
      const palmWorld = new THREE.Vector3(0, 0, 0);
      const palmTarget = new THREE.Vector3(0, 0, 0);
      const palmQuat = new THREE.Quaternion();
      const palmQuatTarget = new THREE.Quaternion();
      const _wrist = new THREE.Vector3();
      const _index = new THREE.Vector3();
      const _pinky = new THREE.Vector3();
      const _mid = new THREE.Vector3();
      const _vx = new THREE.Vector3();
      const _vy = new THREE.Vector3();
      const _vz = new THREE.Vector3();
      const _mat = new THREE.Matrix4();
      const _offset = new THREE.Vector3();
      let handFitScale = 1;
      let handFitTarget = 1;
      let palmFaceAmount = 0; // 0 = úp, 1 = ngửa về camera


      const statusHint = document.getElementById("status-hint");
      const shapeNameEl = document.getElementById("current-shape-name");

      // --- Scene ---
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 8;

      const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1 : 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      function createHardCircleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.5, "rgba(255,255,255,0.9)");
        gradient.addColorStop(0.8, "rgba(255,255,255,0.1)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 8;
        colors[i] = 1;
      }
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: isMobile ? 0.09 : 0.07,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: createHardCircleTexture(),
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Compact, flatter shapes so they rest on the palm surface
      const BASE = 0.95;
      const shapes = {
        sphere: (i) => {
          const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
          const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
          return [
            BASE * Math.cos(theta) * Math.sin(phi),
            BASE * Math.sin(theta) * Math.sin(phi),
            BASE * Math.cos(phi) * 0.55,
          ];
        },
        heart: (i) => {
          const phi = (i / PARTICLE_COUNT) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(phi), 3);
          const y =
            13 * Math.cos(phi) -
            5 * Math.cos(2 * phi) -
            2 * Math.cos(3 * phi) -
            Math.cos(4 * phi);
          return [x * 0.065, y * 0.065, (Math.random() - 0.5) * 0.12];
        },
        saturn: (i) => {
          if (i < PARTICLE_COUNT * 0.55) {
            const phi = Math.acos(-1 + (2 * i) / (PARTICLE_COUNT * 0.55));
            const theta = Math.sqrt(PARTICLE_COUNT * 0.55 * Math.PI) * phi;
            const r = BASE * 0.55;
            return [
              r * Math.cos(theta) * Math.sin(phi),
              r * Math.sin(theta) * Math.sin(phi),
              r * Math.cos(phi) * 0.55,
            ];
          }
          const angle = Math.random() * Math.PI * 2;
          const r = BASE * 0.85 + Math.random() * 0.28;
          return [r * Math.cos(angle), r * Math.sin(angle), (Math.random() - 0.5) * 0.08];
        },
        flower: (i) => {
          const a = (i / PARTICLE_COUNT) * Math.PI * 2;
          const fill = Math.sqrt(Math.random());
          const r = (0.25 + 0.7 * Math.abs(Math.cos(a * 3))) * fill * BASE;
          return [Math.cos(a) * r, Math.sin(a) * r, (Math.random() - 0.5) * 0.1];
        },
        fireworks: (i) => {
          const r = Math.pow(Math.random(), 1 / 3) * BASE * 1.1;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          return [
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi) * 0.5,
          ];
        },
      };

      function getTargetPositions(shapeName) {
        const arr = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const [x, y, z] = shapes[shapeName](i);
          arr[i * 3] = x;
          arr[i * 3 + 1] = y;
          arr[i * 3 + 2] = z;
        }
        return arr;
      }

      targetPositions = getTargetPositions(currentShape);

      function cycleShape() {
        const now = Date.now();
        if (now - lastPinchTime < 4000) return;
        shapeIndex = (shapeIndex + 1) % shapeList.length;
        currentShape = shapeList[shapeIndex];
        shapeNameEl.innerText = shapeNamesVi[currentShape];
        targetPositions = getTargetPositions(currentShape);
        lastPinchTime = now;
        statusHint.textContent = "Đã đổi hình: " + shapeNamesVi[currentShape];
      }

      // Landmark → world (mirrored fullscreen video)
      function landmarkToWorld(x, y, out) {
        const ndcX = (1 - x) * 2 - 1;
        const ndcY = (1 - y) * 2 - 1;
        const vFOV = THREE.MathUtils.degToRad(camera.fov);
        const dist = camera.position.z;
        const visibleH = 2 * Math.tan(vFOV / 2) * dist;
        const visibleW = visibleH * camera.aspect;
        out.set(ndcX * visibleW * 0.5, ndcY * visibleH * 0.5, 0);
      }

      function palmCenter(lm) {
        // Slightly toward fingers so shape sits in the palm bowl, not on wrist
        const idxs = [0, 5, 9, 13, 17];
        let x = 0, y = 0;
        for (const i of idxs) {
          x += lm[i].x;
          y += lm[i].y;
        }
        x = x / idxs.length * 0.65 + lm[9].x * 0.35;
        y = y / idxs.length * 0.65 + lm[9].y * 0.35;
        return { x, y };
      }

      function handSpan(lm) {
        return Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y);
      }

      // Build palm basis: XY = palm surface, Z = outward normal (toward camera when ngửa)
      function updatePalmPose(lm) {
        landmarkToWorld(lm[0].x, lm[0].y, _wrist);
        landmarkToWorld(lm[5].x, lm[5].y, _index);
        landmarkToWorld(lm[17].x, lm[17].y, _pinky);
        landmarkToWorld(lm[9].x, lm[9].y, _mid);

        // Across palm (index ↔ pinky), along fingers (wrist → middle)
        _vx.subVectors(_index, _pinky).normalize();
        _vy.subVectors(_mid, _wrist).normalize();
        _vz.crossVectors(_vx, _vy).normalize();

        // Palm facing camera / "ngửa lên" → normal points toward camera (+Z)
        if (_vz.z < 0) _vz.negate();

        // Re-orthogonalize
        _vx.crossVectors(_vy, _vz).normalize();
        _vy.crossVectors(_vz, _vx).normalize();

        _mat.makeBasis(_vx, _vy, _vz);
        palmQuatTarget.setFromRotationMatrix(_mat);

        // How much palm faces camera (0 úp tay → 1 ngửa)
        palmFaceAmount = THREE.MathUtils.clamp(_vz.z, 0, 1);
        palmFacingUp = palmFaceAmount > 0.35;

        const palm = palmCenter(lm);
        landmarkToWorld(palm.x, palm.y, palmTarget);
        // Lift shape slightly along normal so it sits ON the palm, not inside it
        _offset.copy(_vz).multiplyScalar(0.18 + palmFaceAmount * 0.12);
        palmTarget.add(_offset);

        // Fit to palm width
        const span = handSpan(lm);
        handFitTarget = THREE.MathUtils.clamp(
          THREE.MathUtils.mapLinear(span, 0.08, 0.28, 0.5, 1.15),
          0.4,
          1.25
        );
        // Shrink when palm is not facing up so it doesn't float oddly
        if (!palmFacingUp) handFitTarget *= 0.35;
      }

      // --- Hand tracking ---
      const videoElement = document.getElementById("webcam-feed");
      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: isMobile ? 0 : 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6,
      });

      hands.onResults((results) => {
        document.getElementById("loading").style.display = "none";

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const lm = results.multiHandLandmarks[0];
          handDetected = true;

          updatePalmPose(lm);

          handX = (1 - lm[8].x) * 2 - 1;
          handY = (1 - lm[8].y) * 2 - 1;

          const pinchDist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
          isPinching = pinchDist < 0.05;
          if (isPinching) cycleShape();

          const isIndexDown = lm[8].y > lm[6].y;
          const isMiddleDown = lm[12].y > lm[10].y;
          const isRingDown = lm[16].y > lm[14].y;
          const isPinkyDown = lm[20].y > lm[18].y;

          isFist = isIndexDown && isMiddleDown && isRingDown && isPinkyDown;
          isFrozen = !isIndexDown && isMiddleDown && isRingDown && isPinkyDown;
          isOpenPalm =
            !isIndexDown &&
            !isMiddleDown &&
            !isRingDown &&
            !isPinkyDown &&
            !isPinching;

          if (!palmFacingUp) {
            statusHint.textContent = "Ngửa lòng bàn tay lên để hình nằm trên tay";
          } else if (isFrozen) {
            statusHint.textContent = "Đóng băng";
          } else if (isPinching) {
            statusHint.textContent = "Đổi hình…";
          } else if (isFist) {
            statusHint.textContent = "Phóng to · hình trên lòng bàn tay";
          } else if (isOpenPalm) {
            statusHint.textContent = "Thu nhỏ · hình nằm trên lòng bàn tay";
          } else {
            statusHint.textContent = "Hình đang nằm trên lòng bàn tay";
          }
        } else {
          handDetected = false;
          isFist = false;
          isOpenPalm = false;
          isFrozen = false;
          isPinching = false;
          palmFacingUp = false;
          palmFaceAmount = 0;
          palmTarget.set(0, 0, 0);
          palmQuatTarget.identity();
          handFitTarget = 0.6;
          statusHint.textContent = "Ngửa lòng bàn tay vào khung hình";
        }
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: isMobile ? 480 : 720,
        height: isMobile ? 320 : 480,
      });
      cameraUtils.start();

      // --- Animation ---
      const clock = new THREE.Clock();
      const colorObj = new THREE.Color();
      const tmpScale = new THREE.Vector3();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        const posAttr = particles.geometry.attributes.position;
        const colAttr = particles.geometry.attributes.color;

        // Follow palm position + orientation (shape lies on palm surface)
        palmWorld.lerp(palmTarget, 0.28);
        palmQuat.slerp(palmQuatTarget, 0.28);
        handFitScale += (handFitTarget - handFitScale) * 0.18;

        particles.position.copy(palmWorld);
        particles.quaternion.copy(palmQuat);

        // Visibility: stronger when palm faces up toward camera
        const faceVis = handDetected ? 0.25 + palmFaceAmount * 0.75 : 0.2;
        material.opacity = faceVis * 0.95;

        if (!isFrozen) {
          // Tiny living shimmer only — orientation comes from the palm
          // (no free orbit that lifts the shape off the hand)

          let gestureScale = 1.0;
          if (isFist) gestureScale = 1.45;
          else if (isOpenPalm) gestureScale = 0.62;
          const s =
            handFitScale *
            gestureScale *
            (handDetected ? 0.85 + palmFaceAmount * 0.2 : 0.5);
          tmpScale.set(s, s, s);
          particles.scale.lerp(tmpScale, 0.16);

          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ix = i * 3;
            posAttr.array[ix] += (targetPositions[ix] - posAttr.array[ix]) * 0.1;
            posAttr.array[ix + 1] +=
              (targetPositions[ix + 1] - posAttr.array[ix + 1]) * 0.1;
            posAttr.array[ix + 2] +=
              (targetPositions[ix + 2] - posAttr.array[ix + 2]) * 0.1;

            if (currentShape !== "fireworks") {
              posAttr.array[ix] += Math.sin(time * 0.5 + i) * 0.002;
              posAttr.array[ix + 1] += Math.cos(time * 0.5 + i) * 0.002;
            } else {
              posAttr.array[ix + 1] -= 0.01;
              if (posAttr.array[ix + 1] < -1.6) posAttr.array[ix + 1] = 1.6;
            }

            const dist = Math.hypot(posAttr.array[ix], posAttr.array[ix + 1]);
            const hue = ((handY + 1) * 0.5 + dist * 0.2) % 1;
            colorObj.setHSL(hue, 0.85, 0.62);
            colAttr.array[ix] = colorObj.r;
            colAttr.array[ix + 1] = colorObj.g;
            colAttr.array[ix + 2] = colorObj.b;
          }
          posAttr.needsUpdate = true;
          colAttr.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.scale !== 1) e.preventDefault();
        },
        { passive: false }
      );

      animate();
    </script>
  </body>
</html>
