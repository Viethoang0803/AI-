<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
    />
    <title>Dòng Hạt Đồng Bộ Tay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --glass: rgba(255, 255, 255, 0.03);
        --glass-heavy: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.15);
        --accent: #00f2ff;
        --freeze: #ff4d4d;
        --morph: #a855f7;
        --shrink: #4ade80;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: "Inter", sans-serif;
        color: white;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      #webcam-feed {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        z-index: 0;
        background: #111;
      }

      #webcam-dim {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.35) 100%
        );
      }

      canvas {
        position: fixed !important;
        inset: 0;
        z-index: 2;
        display: block;
      }

      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        width: auto;
        text-align: left;
        pointer-events: none;
        z-index: 10;
        max-width: 90%;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
      }


      #info h1 {
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0;
        margin-bottom: 15px;
        font-size: clamp(1.5rem, 6vw, 2.5rem);
        background: white;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 20px rgba(103, 108, 108, 0.4);
        line-height: 1.2;
      }


      #info p {
        font-size: clamp(0.55rem, 2.5vw, 0.75rem);
        margin-top: 10px;
        letter-spacing: 1px;
        line-height: 1.8;
        text-transform: uppercase;
        font-weight: 500;
      }

      #info b {
        color: var(--accent);
        background: rgba(0, 242, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(0, 242, 255, 0.2);
        margin: 0 3px;
        font-size: 0.9em;
      }

      /* Shape display - responsive positioning */
      #shape-display {
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: right;
        z-index: 10;
        pointer-events: none;
        max-width: 40%;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
      }

      #shape-label {
        font-size: clamp(0.5rem, 2vw, 0.7rem);
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.5;
        margin-bottom: 2px;
      }

      #current-shape-name {
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        text-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        line-height: 1.2;
        word-break: break-word;
      }

      #status-hint {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 10;
        font-size: clamp(0.58rem, 2.2vw, 0.72rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.75);
        pointer-events: none;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        color: var(--accent);
        letter-spacing: 1px;
        font-size: clamp(0.7rem, 3vw, 0.9rem);
        text-transform: uppercase;
        text-align: center;
        padding: 0 20px;
        width: 80%;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
      }


      @media (max-width: 768px) {
        #info {
          top: 15px;
          left: 15px;
        }

        #shape-display {
          top: 15px;
          right: 15px;
        }

        #info p {
          line-height: 1.6;
        }
      }

      @media (max-width: 480px) {
        #info {
          top: 12px;
          left: 12px;
        }

        #shape-display {
          top: 12px;
          right: 12px;
        }

        #info h1 {
          margin-bottom: 10px;
          letter-spacing: 0.5px;
        }

        #info p {
          letter-spacing: 0.8px;
        }
      }

  
      @media (max-width: 320px) {
        #info p {
          font-size: 0.5rem;
          line-height: 1.4;
        }

        #shape-label {
          font-size: 0.45rem;
        }

        #current-shape-name {
          font-size: 0.9rem;
        }
      }

      
      @media (max-height: 500px) and (orientation: landscape) {
        #info {
          top: 10px;
          left: 10px;
        }

        #info h1 {
          font-size: 1.2rem;
          margin-bottom: 8px;
        }

        #info p {
          font-size: 0.5rem;
          line-height: 1.3;
          margin-top: 5px;
        }

        #shape-display {
          top: 10px;
          right: 10px;
        }

        #loading {
          font-size: 0.6rem;
        }
      }
    </style>
  </head>
  <body>
    <video id="webcam-feed" autoplay playsinline muted></video>
    <div id="webcam-dim"></div>

    <div id="info">
      <h1>Dòng Hạt Đồng Bộ</h1>
      <p>
        👋 <b>NGỬA TAY</b> → <span style="opacity: 0.6">HÌNH NẰM TRÊN TAY</span><br />
        🤏 <b>CHỤM</b> → <span style="opacity: 0.6">ĐỔI HÌNH</span><br />
        ✊ <b>NẮM TAY</b> → <span style="opacity: 0.6">PHÓNG TO</span><br />
        🖐️ <b>XÒE TAY</b> → <span style="opacity: 0.6">THU NHỎ</span><br />
        ☝️ <b>1 NGÓN</b> → <span style="opacity: 0.6">ĐÓNG BĂNG</span>
      </p>
    </div>

    <div id="shape-display">
      <div id="shape-label">Hình hiện tại</div>
      <div id="current-shape-name">Quả cầu</div>
    </div>

    <div id="status-hint">Ngửa lòng bàn tay vào khung hình</div>
    <div id="loading">Đang khởi tạo…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>

    <script>
    
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const PARTICLE_COUNT = isMobile ? 10000 : 20000;

      let currentShape = "sphere";
      const shapeList = ["sphere", "heart", "saturn", "flower", "fireworks"];
      const shapeNamesVi = {
        sphere: "Quả cầu",
        heart: "Trái tim",
        saturn: "Sao Thổ",
        flower: "Bông hoa",
        fireworks: "Pháo hoa",
      };
      let shapeIndex = 0;

      let targetPositions = [];
      let handX = 0,
        handY = 0;
      let isPinching = false;
      let isFist = false;
      let isOpenPalm = false;
      let isFrozen = false;
      let handDetected = false;

      let lastPinchTime = 0;

      // Palm overlay (keep original Hand-Sync visuals)
      const palmPos = new THREE.Vector3();
      const palmPosTarget = new THREE.Vector3();
      let palmScale = 0.38;
      let palmScaleTarget = 0.38;
      const statusHint = document.getElementById("status-hint");
      const colorObj = new THREE.Color();
      const tmpScale = new THREE.Vector3();

      // --- Scene Setup ---
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, isMobile ? 1 : 2)
      );
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      function createHardCircleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.5, "rgba(255,255,255,0.9)");
        gradient.addColorStop(0.8, "rgba(255,255,255,0.1)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);

      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 20;
        colors[i] = 1;
      }

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
      );
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const baseParticleSize = isMobile ? 0.15 : 0.12;
      const material = new THREE.PointsMaterial({
        size: baseParticleSize,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: createHardCircleTexture(),
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Stable palette per shape — only refreshed on pinch morph
      const shapeHue = {
        sphere: 0.55,
        heart: 0.95,
        saturn: 0.12,
        flower: 0.82,
        fireworks: 0.08,
      };

      // --- Shapes Math ---
      const shapes = {
        sphere: (i) => {
          const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
          const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
          return [
            4 * Math.cos(theta) * Math.sin(phi),
            4 * Math.sin(theta) * Math.sin(phi),
            4 * Math.cos(phi),
          ];
        },
        heart: (i) => {
          const phi = Math.random() * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(phi), 3);
          const y =
            13 * Math.cos(phi) -
            5 * Math.cos(2 * phi) -
            2 * Math.cos(3 * phi) -
            Math.cos(4 * phi);
          return [x * 0.25, y * 0.25, (Math.random() - 0.5) * 2];
        },
        saturn: (i) => {
          if (i < PARTICLE_COUNT * 0.6) {
            const phi = Math.acos(-1 + (2 * i) / (PARTICLE_COUNT * 0.6));
            const theta = Math.sqrt(PARTICLE_COUNT * 0.6 * Math.PI) * phi;
            return [
              2.5 * Math.cos(theta) * Math.sin(phi),
              2.5 * Math.sin(theta) * Math.sin(phi),
              2.5 * Math.cos(phi),
            ];
          } else {
            const angle = Math.random() * Math.PI * 2;
            const r = 4.5 + Math.random() * 2;
            return [
              r * Math.cos(angle),
              (Math.random() - 0.5) * 0.3,
              r * Math.sin(angle),
            ];
          }
        },
        flower: (i) => {
          const u = Math.random() * Math.PI * 2;
          const v = Math.random() * Math.PI;
          const r = 3 + Math.sin(5 * u) * Math.sin(5 * v);
          return [
            r * Math.sin(v) * Math.cos(u),
            r * Math.sin(v) * Math.sin(u),
            r * Math.cos(v),
          ];
        },
        fireworks: (i) => {
          const r = Math.pow(Math.random(), 1 / 3) * 7;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          return [
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi),
          ];
        },
      };

      function getTargetPositions(shapeName) {
        const arr = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const [x, y, z] = shapes[shapeName](i);
          arr[i * 3] = x;
          arr[i * 3 + 1] = y;
          arr[i * 3 + 2] = z;
        }
        return arr;
      }

      targetPositions = getTargetPositions(currentShape);

      function applyShapeColors() {
        const colAttr = particles.geometry.attributes.color;
        const base = shapeHue[currentShape] || 0.5;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const ix = i * 3;
          const dist = Math.hypot(
            targetPositions[ix],
            targetPositions[ix + 1],
            targetPositions[ix + 2]
          );
          colorObj.setHSL((base + dist * 0.04) % 1, 0.72, 0.52);
          colAttr.array[ix] = colorObj.r;
          colAttr.array[ix + 1] = colorObj.g;
          colAttr.array[ix + 2] = colorObj.b;
        }
        colAttr.needsUpdate = true;
      }

      function cycleShape() {
        const now = Date.now();
        if (now - lastPinchTime < 4000) return;

        shapeIndex = (shapeIndex + 1) % shapeList.length;
        currentShape = shapeList[shapeIndex];

        document.getElementById("current-shape-name").innerText =
          shapeNamesVi[currentShape] || currentShape;

        targetPositions = getTargetPositions(currentShape);
        applyShapeColors();
        lastPinchTime = now;
      }

      function landmarkToWorld(x, y, out) {
        // Mirrored fullscreen webcam → NDC → world at z≈0
        const ndcX = (1 - x) * 2 - 1;
        const ndcY = (1 - y) * 2 - 1;
        const vFOV = THREE.MathUtils.degToRad(camera.fov);
        const dist = camera.position.z;
        const visibleH = 2 * Math.tan(vFOV / 2) * dist;
        const visibleW = visibleH * camera.aspect;
        out.set(ndcX * (visibleW * 0.5), ndcY * (visibleH * 0.5), 0.2);
      }

      function updatePalmFromLandmarks(lm) {
        // Palm center (toward middle of hand)
        const cx =
          (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5 * 0.4 +
          lm[9].x * 0.6;
        const cy =
          (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5 * 0.4 +
          lm[9].y * 0.6;
        landmarkToWorld(cx, cy, palmPosTarget);

        // Fit original Hand-Sync formation (~radius 4) into the palm
        const span = Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y);
        palmScaleTarget = THREE.MathUtils.clamp(
          THREE.MathUtils.mapLinear(span, 0.08, 0.28, 0.28, 0.52),
          0.26,
          0.58
        );
      }

      // --- Hand Tracking ---
      const videoElement = document.getElementById("webcam-feed");
      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: isMobile ? 0 : 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6,
      });

      hands.onResults((results) => {
        document.getElementById("loading").style.display = "none";
        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length > 0
        ) {
          const lm = results.multiHandLandmarks[0];
          handDetected = true;
          updatePalmFromLandmarks(lm);

          handX = (1 - lm[8].x) * 2 - 1;
          handY = (1 - lm[8].y) * 2 - 1;

          const pinchDist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
          isPinching = pinchDist < 0.05;
          if (isPinching) cycleShape();

          const isIndexDown = lm[8].y > lm[6].y;
          const isMiddleDown = lm[12].y > lm[10].y;
          const isRingDown = lm[16].y > lm[14].y;
          const isPinkyDown = lm[20].y > lm[18].y;

          isFist = isIndexDown && isMiddleDown && isRingDown && isPinkyDown;
          isFrozen = !isIndexDown && isMiddleDown && isRingDown && isPinkyDown;
          isOpenPalm =
            !isIndexDown &&
            !isMiddleDown &&
            !isRingDown &&
            !isPinkyDown &&
            !isPinching;

          if (isFrozen) statusHint.textContent = "Đóng băng";
          else if (isPinching) statusHint.textContent = "Đổi hình…";
          else if (isFist) statusHint.textContent = "Phóng to · trên lòng bàn tay";
          else if (isOpenPalm) statusHint.textContent = "Thu nhỏ · trên lòng bàn tay";
          else statusHint.textContent = "Hình đang nằm trên lòng bàn tay";
        } else {
          handDetected = false;
          isFist = false;
          isOpenPalm = false;
          isFrozen = false;
          isPinching = false;
          palmPosTarget.set(0, 0, 0);
          palmScaleTarget = 0.38;
          statusHint.textContent = "Ngửa lòng bàn tay vào khung hình";
        }
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: isMobile ? 480 : 720,
        height: isMobile ? 320 : 480,
      });
      cameraUtils.start();

      // --- Animation Loop ---
      applyShapeColors();

      function animate() {
        requestAnimationFrame(animate);
        const posAttr = particles.geometry.attributes.position;

        // Nest formation onto the palm (fullscreen webcam behind)
        palmPos.lerp(palmPosTarget, 0.3);
        palmScale += (palmScaleTarget - palmScale) * 0.18;
        particles.position.copy(palmPos);

        if (!isFrozen) {
          // Spin only from hand motion (gesture), not a free time drift
          particles.rotation.y += handX * 0.018;
          particles.rotation.x += handY * 0.01;

          // Palm-fit scale × gesture scale
          let gesture = 1.0;
          if (isFist) gesture = 1.75;
          else if (isOpenPalm) gesture = 0.55;
          const s = palmScale * gesture * (handDetected ? 1 : 0.85);
          tmpScale.set(s, s, s);
          particles.scale.lerp(tmpScale, 0.14);

          // Shrink packs particles → AdditiveBlending washes white; dim + smaller dots
          const shrinkAmt = isOpenPalm ? 1 : 0;
          const targetOpacity = isOpenPalm ? 0.42 : isFist ? 0.9 : 0.8;
          const targetSize =
            baseParticleSize * (isOpenPalm ? 0.55 : isFist ? 1.05 : 1);
          material.opacity += (targetOpacity - material.opacity) * 0.2;
          material.size += (targetSize - material.size) * 0.2;
          // Avoid pure additive wash when tightly packed
          material.blending =
            shrinkAmt || particles.scale.x < palmScale * 0.7
              ? THREE.NormalBlending
              : THREE.AdditiveBlending;

          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ix = i * 3;
            posAttr.array[ix] +=
              (targetPositions[ix] - posAttr.array[ix]) * 0.08;
            posAttr.array[ix + 1] +=
              (targetPositions[ix + 1] - posAttr.array[ix + 1]) * 0.08;
            posAttr.array[ix + 2] +=
              (targetPositions[ix + 2] - posAttr.array[ix + 2]) * 0.08;
          }
          posAttr.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

   
      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.scale !== 1) e.preventDefault();
        },
        { passive: false }
      );

      animate();
    </script>
  </body>
</html>
