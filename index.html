<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
    />
    <title>Dòng Hạt Đồng Bộ Tay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --accent: #00f2ff;
        --freeze: #ff4d4d;
        --morph: #a855f7;
        --shrink: #4ade80;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: "Inter", sans-serif;
        color: white;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      #webcam-feed {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        z-index: 0;
        background: #111;
      }

      #webcam-dim {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.05) 0%,
          rgba(0, 0, 0, 0.28) 100%
        );
      }

      canvas {
        position: fixed !important;
        inset: 0;
        z-index: 2;
        display: block;
      }

      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        pointer-events: none;
        max-width: min(92vw, 22rem);
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
      }

      #info h1 {
        font-weight: 700;
        margin: 0 0 12px;
        font-size: clamp(1.35rem, 5vw, 2.1rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.15;
      }

      #info p {
        font-size: clamp(0.58rem, 2.3vw, 0.72rem);
        margin: 0;
        letter-spacing: 0.04em;
        line-height: 1.75;
        font-weight: 500;
        opacity: 0.95;
      }

      #info b {
        color: var(--accent);
        background: rgba(0, 242, 255, 0.12);
        padding: 2px 6px;
        border: 1px solid rgba(0, 242, 255, 0.25);
        margin: 0 2px;
        font-size: 0.92em;
      }

      #shape-display {
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: right;
        z-index: 10;
        pointer-events: none;
        max-width: 42%;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
      }

      #shape-label {
        font-size: clamp(0.5rem, 2vw, 0.68rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.55;
        margin-bottom: 2px;
      }

      #current-shape-name {
        font-size: clamp(1rem, 4vw, 1.45rem);
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: 0 0 20px rgba(0, 242, 255, 0.45);
        line-height: 1.2;
      }

      #status-hint {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 10;
        font-size: clamp(0.58rem, 2.2vw, 0.7rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        pointer-events: none;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        white-space: nowrap;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        color: var(--accent);
        letter-spacing: 0.08em;
        font-size: clamp(0.7rem, 3vw, 0.9rem);
        text-transform: uppercase;
        text-align: center;
        padding: 0 20px;
        width: 80%;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
      }

      @media (max-width: 640px) {
        #info { top: 12px; left: 12px; }
        #shape-display { top: 12px; right: 12px; }
        #info p { line-height: 1.55; }
      }
    </style>
  </head>
  <body>
    <video id="webcam-feed" autoplay playsinline muted></video>
    <div id="webcam-dim"></div>

    <div id="info">
      <h1>Dòng Hạt Đồng Bộ</h1>
      <p>
        👋 <b>NGỬA LÒNG BÀN TAY</b> → <span style="opacity: 0.65">HÌNH NẰM TRÊN TAY</span><br />
        🤏 <b>CHỤM</b> → <span style="opacity: 0.65">ĐỔI HÌNH</span><br />
        ✊ <b>NẮM TAY</b> → <span style="opacity: 0.65">PHÓNG TO</span><br />
        🖐️ <b>XÒE TAY</b> → <span style="opacity: 0.65">THU NHỎ</span><br />
        ☝️ <b>1 NGÓN</b> → <span style="opacity: 0.65">ĐÓNG BĂNG</span>
      </p>
    </div>

    <div id="shape-display">
      <div id="shape-label">Hình hiện tại</div>
      <div id="current-shape-name">Quả cầu</div>
    </div>

    <div id="status-hint">Đưa tay vào khung hình</div>
    <div id="loading">Đang khởi tạo camera…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>

    <script>
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      // Fewer particles = clearer silhouette
      const PARTICLE_COUNT = isMobile ? 3500 : 5000;

      const shapeList = [
        "sphere", "heart", "saturn", "flower", "star",
        "torus", "cube", "infinity", "spiral", "dna", "fireworks",
      ];
      const shapeNamesVi = {
        sphere: "Quả cầu",
        heart: "Trái tim",
        saturn: "Sao Thổ",
        flower: "Bông hoa",
        star: "Ngôi sao",
        torus: "Vòng torus",
        cube: "Khối lập phương",
        infinity: "Vô cực",
        spiral: "Xoắn ốc",
        dna: "ADN",
        fireworks: "Pháo hoa",
      };

      let currentShape = "sphere";
      let shapeIndex = 0;
      let targetPositions = [];

      let handX = 0;
      let handY = 0;
      let isPinching = false;
      let isFist = false;
      let isOpenPalm = false;
      let isFrozen = false;
      let handDetected = false;
      let lastPinchTime = 0;

      const palmWorld = new THREE.Vector3(0, 0, 0);
      const palmTarget = new THREE.Vector3(0, 0, 0);
      let palmRoll = 0;
      let palmRollTarget = 0;
      let handFitScale = 1.1;
      let handFitTarget = 1.1;

      const statusHint = document.getElementById("status-hint");
      const shapeNameEl = document.getElementById("current-shape-name");

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        48,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 7;

      const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      function createHardCircleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.4, "rgba(255,255,255,1)");
        gradient.addColorStop(0.75, "rgba(255,255,255,0.35)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 4;
        colors[i] = 1;
      }
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: isMobile ? 0.16 : 0.13,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: createHardCircleTexture(),
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Larger, flatter silhouettes facing the camera (rest on palm visually)
      const BASE = 1.45;
      const shapes = {
        sphere: (i) => {
          const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
          const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
          return [
            BASE * Math.cos(theta) * Math.sin(phi),
            BASE * Math.sin(theta) * Math.sin(phi),
            BASE * Math.cos(phi) * 0.45,
          ];
        },
        heart: (i) => {
          const phi = (i / PARTICLE_COUNT) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(phi), 3);
          const y =
            13 * Math.cos(phi) -
            5 * Math.cos(2 * phi) -
            2 * Math.cos(3 * phi) -
            Math.cos(4 * phi);
          return [x * 0.09, y * 0.09, (Math.random() - 0.5) * 0.15];
        },
        saturn: (i) => {
          if (i < PARTICLE_COUNT * 0.55) {
            const phi = Math.acos(-1 + (2 * i) / (PARTICLE_COUNT * 0.55));
            const theta = Math.sqrt(PARTICLE_COUNT * 0.55 * Math.PI) * phi;
            const r = BASE * 0.65;
            return [
              r * Math.cos(theta) * Math.sin(phi),
              r * Math.sin(theta) * Math.sin(phi),
              r * Math.cos(phi) * 0.45,
            ];
          }
          const angle = Math.random() * Math.PI * 2;
          const r = BASE * 1.0 + Math.random() * 0.35;
          return [r * Math.cos(angle), r * Math.sin(angle), (Math.random() - 0.5) * 0.1];
        },
        flower: (i) => {
          const a = (i / PARTICLE_COUNT) * Math.PI * 2;
          const fill = Math.sqrt((i * 17) % 1000 / 1000);
          const r = (0.28 + 0.72 * Math.abs(Math.cos(a * 3))) * fill * BASE;
          return [Math.cos(a) * r, Math.sin(a) * r, (Math.random() - 0.5) * 0.12];
        },
        star: (i) => {
          const a = (i / PARTICLE_COUNT) * Math.PI * 2;
          const fill = Math.sqrt((i * 31) % 1000 / 1000);
          const spikes = 5;
          const sharp = Math.cos(spikes * a);
          const r = (0.4 + 0.6 * Math.pow(Math.abs(sharp), 0.65)) * fill * BASE;
          return [Math.cos(a) * r, Math.sin(a) * r, (Math.random() - 0.5) * 0.12];
        },
        torus: (i) => {
          const u = (i / PARTICLE_COUNT) * Math.PI * 2;
          const v = ((i * 7) % PARTICLE_COUNT) / PARTICLE_COUNT * Math.PI * 2;
          const R = BASE * 0.85, r = BASE * 0.28;
          return [
            (R + r * Math.cos(v)) * Math.cos(u),
            (R + r * Math.cos(v)) * Math.sin(u),
            r * Math.sin(v) * 0.7,
          ];
        },
        cube: (i) => {
          const face = i % 6;
          const a = (((i * 13) % 1000) / 1000) * 2 - 1;
          const b = (((i * 29) % 1000) / 1000) * 2 - 1;
          const h = BASE * 0.7;
          if (face === 0) return [h, a * h, b * h * 0.35];
          if (face === 1) return [-h, a * h, b * h * 0.35];
          if (face === 2) return [a * h, h, b * h * 0.35];
          if (face === 3) return [a * h, -h, b * h * 0.35];
          if (face === 4) return [a * h, b * h, h * 0.35];
          return [a * h, b * h, -h * 0.35];
        },
        infinity: (i) => {
          const t = (i / PARTICLE_COUNT) * Math.PI * 2;
          const s = BASE * 0.95;
          const den = 1 + Math.sin(t) * Math.sin(t);
          return [
            (s * Math.cos(t)) / den,
            (s * Math.sin(t) * Math.cos(t)) / den,
            (Math.random() - 0.5) * 0.12,
          ];
        },
        spiral: (i) => {
          const t = i / PARTICLE_COUNT;
          const ang = t * Math.PI * 8;
          const r = t * BASE * 1.15;
          return [
            Math.cos(ang) * r,
            Math.sin(ang) * r,
            (t - 0.5) * 0.35,
          ];
        },
        dna: (i) => {
          const t = i / PARTICLE_COUNT;
          const y = (t - 0.5) * BASE * 2.1;
          const strand = i % 2;
          const ang = t * Math.PI * 7 + strand * Math.PI;
          const r = BASE * 0.35;
          return [Math.cos(ang) * r, y, Math.sin(ang) * r * 0.5];
        },
        fireworks: (i) => {
          const r = Math.pow(Math.random(), 1 / 3) * BASE * 1.2;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          return [
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi) * 0.4,
          ];
        },
      };

      function getTargetPositions(shapeName) {
        const arr = new Float32Array(PARTICLE_COUNT * 3);
        const fn = shapes[shapeName] || shapes.sphere;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const [x, y, z] = fn(i);
          arr[i * 3] = x;
          arr[i * 3 + 1] = y;
          arr[i * 3 + 2] = z;
        }
        return arr;
      }

      targetPositions = getTargetPositions(currentShape);

      function cycleShape() {
        const now = Date.now();
        if (now - lastPinchTime < 3500) return;
        shapeIndex = (shapeIndex + 1) % shapeList.length;
        currentShape = shapeList[shapeIndex];
        shapeNameEl.innerText = shapeNamesVi[currentShape];
        targetPositions = getTargetPositions(currentShape);
        lastPinchTime = now;
        statusHint.textContent = "Đã đổi hình: " + shapeNamesVi[currentShape];
      }

      function landmarkToWorld(x, y, out) {
        const ndcX = (1 - x) * 2 - 1;
        const ndcY = (1 - y) * 2 - 1;
        const vFOV = THREE.MathUtils.degToRad(camera.fov);
        const dist = camera.position.z;
        const visibleH = 2 * Math.tan(vFOV / 2) * dist;
        const visibleW = visibleH * camera.aspect;
        out.set(ndcX * visibleW * 0.5, ndcY * visibleH * 0.5, 0);
      }

      function palmCenter(lm) {
        // Center of palm bowl (between MCPs), slightly toward middle finger
        let x =
          (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
        let y =
          (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
        x = x * 0.45 + lm[9].x * 0.55;
        y = y * 0.45 + lm[9].y * 0.55;
        return { x, y };
      }

      function updatePalmPose(lm) {
        const palm = palmCenter(lm);
        landmarkToWorld(palm.x, palm.y, palmTarget);
        // Keep shape on the palm plane facing camera (slightly in front)
        palmTarget.z = 0.15;

        // Roll only: align with palm left-right (index–pinky), stay face-on
        const ix = 1 - lm[5].x;
        const iy = lm[5].y;
        const px = 1 - lm[17].x;
        const py = lm[17].y;
        palmRollTarget = Math.atan2(py - iy, px - ix);

        // Size from palm width — a bit larger for clarity
        const span = Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y);
        handFitTarget = THREE.MathUtils.clamp(
          THREE.MathUtils.mapLinear(span, 0.07, 0.26, 0.85, 1.55),
          0.75,
          1.7
        );
      }

      const videoElement = document.getElementById("webcam-feed");
      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: isMobile ? 0 : 1,
        minDetectionConfidence: 0.55,
        minTrackingConfidence: 0.55,
      });

      hands.onResults((results) => {
        document.getElementById("loading").style.display = "none";

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const lm = results.multiHandLandmarks[0];
          handDetected = true;
          updatePalmPose(lm);

          handX = (1 - lm[8].x) * 2 - 1;
          handY = (1 - lm[8].y) * 2 - 1;

          const pinchDist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
          isPinching = pinchDist < 0.05;
          if (isPinching) cycleShape();

          const isIndexDown = lm[8].y > lm[6].y;
          const isMiddleDown = lm[12].y > lm[10].y;
          const isRingDown = lm[16].y > lm[14].y;
          const isPinkyDown = lm[20].y > lm[18].y;

          isFist = isIndexDown && isMiddleDown && isRingDown && isPinkyDown;
          isFrozen = !isIndexDown && isMiddleDown && isRingDown && isPinkyDown;
          isOpenPalm =
            !isIndexDown &&
            !isMiddleDown &&
            !isRingDown &&
            !isPinkyDown &&
            !isPinching;

          if (isFrozen) statusHint.textContent = "Đóng băng";
          else if (isPinching) statusHint.textContent = "Đổi hình…";
          else if (isFist) statusHint.textContent = "Phóng to · trên lòng bàn tay";
          else if (isOpenPalm) statusHint.textContent = "Thu nhỏ · trên lòng bàn tay";
          else statusHint.textContent = "Ngửa lòng bàn tay — hình nằm trên tay";
        } else {
          handDetected = false;
          isFist = false;
          isOpenPalm = false;
          isFrozen = false;
          isPinching = false;
          palmTarget.set(0, 0, 0);
          palmRollTarget = 0;
          handFitTarget = 1.0;
          statusHint.textContent = "Ngửa lòng bàn tay vào khung hình";
        }
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: isMobile ? 480 : 720,
        height: isMobile ? 320 : 480,
      });
      cameraUtils.start();

      const clock = new THREE.Clock();
      const colorObj = new THREE.Color();
      const tmpScale = new THREE.Vector3();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        const posAttr = particles.geometry.attributes.position;
        const colAttr = particles.geometry.attributes.color;

        palmWorld.lerp(palmTarget, 0.35);
        palmRoll += (palmRollTarget - palmRoll) * 0.25;
        handFitScale += (handFitTarget - handFitScale) * 0.2;

        // Sit on palm: follow palm center, face camera, light roll with hand
        particles.position.copy(palmWorld);
        particles.rotation.set(0, 0, palmRoll);

        // Always bright enough to read the silhouette
        material.opacity = handDetected ? 1 : 0.55;
        material.size = (isMobile ? 0.16 : 0.13) * (0.95 + handFitScale * 0.08);

        if (!isFrozen) {
          let gestureScale = 1.15;
          if (isFist) gestureScale = 1.65;
          else if (isOpenPalm) gestureScale = 0.7;
          const s = handFitScale * gestureScale * (handDetected ? 1 : 0.9);
          tmpScale.set(s, s, s);
          particles.scale.lerp(tmpScale, 0.2);

          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ix = i * 3;
            posAttr.array[ix] += (targetPositions[ix] - posAttr.array[ix]) * 0.12;
            posAttr.array[ix + 1] +=
              (targetPositions[ix + 1] - posAttr.array[ix + 1]) * 0.12;
            posAttr.array[ix + 2] +=
              (targetPositions[ix + 2] - posAttr.array[ix + 2]) * 0.12;

            if (currentShape !== "fireworks") {
              posAttr.array[ix] += Math.sin(time * 0.45 + i) * 0.0015;
              posAttr.array[ix + 1] += Math.cos(time * 0.45 + i) * 0.0015;
            } else {
              posAttr.array[ix + 1] -= 0.008;
              if (posAttr.array[ix + 1] < -1.8) posAttr.array[ix + 1] = 1.8;
            }

            const dist = Math.hypot(posAttr.array[ix], posAttr.array[ix + 1]);
            const hue = ((handY + 1) * 0.45 + dist * 0.15 + time * 0.03) % 1;
            colorObj.setHSL(hue, 0.9, 0.68);
            colAttr.array[ix] = colorObj.r;
            colAttr.array[ix + 1] = colorObj.g;
            colAttr.array[ix + 2] = colorObj.b;
          }
          posAttr.needsUpdate = true;
          colAttr.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.scale !== 1) e.preventDefault();
        },
        { passive: false }
      );

      animate();
    </script>
  </body>
</html>
