<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07090c" />
  <title>Orbital Hands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-0: #07090c;
      --bg-1: #0e1319;
      --ink: #e8ebe6;
      --muted: rgba(232, 235, 230, 0.42);
      --line: rgba(232, 235, 230, 0.14);
      --accent: #7ec8c3;
      --glow: rgba(126, 200, 195, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-0);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, #121820 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 90%, #0a1820 0%, transparent 50%),
        linear-gradient(165deg, #0a0d11 0%, #07090c 45%, #0b1016 100%);
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transform: scaleX(-1);
      transition: opacity 0.6s ease;
      filter: brightness(0.45) contrast(1.05) saturate(0.85);
    }

    #bg-video.active { opacity: 1; }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, transparent 18%, rgba(7, 9, 12, 0.35) 55%, rgba(7, 9, 12, 0.72) 100%),
        linear-gradient(to bottom, rgba(7, 9, 12, 0.25) 0%, transparent 18%, transparent 82%, rgba(7, 9, 12, 0.45) 100%);
      transition: opacity 0.5s ease;
    }

    body.webcam-bg .atmosphere { opacity: 0.55; }

    header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      padding:
        calc(clamp(1.4rem, 3vw, 2.4rem) + env(safe-area-inset-top, 0px))
        clamp(1.5rem, 3.5vw, 2.8rem)
        0
        calc(clamp(1.5rem, 3.5vw, 2.8rem) + env(safe-area-inset-left, 0px));
      pointer-events: none;
    }

    header h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2rem, 4.2vw, 3.15rem);
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--ink);
      text-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
      animation: titleIn 1.2s ease both;
    }

    header p {
      margin-top: 0.55rem;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      animation: titleIn 1.2s 0.15s ease both;
    }

    @keyframes titleIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hud {
      position: fixed;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      pointer-events: none;
    }

    .hud-bottom {
      left: calc(clamp(1.5rem, 3.5vw, 2.8rem) + env(safe-area-inset-left, 0px));
      bottom: calc(clamp(1.3rem, 3vw, 2.2rem) + env(safe-area-inset-bottom, 0px));
      flex-direction: column;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .hud-top-right {
      top: calc(clamp(1.4rem, 3vw, 2.4rem) + env(safe-area-inset-top, 0px));
      right: calc(clamp(1.5rem, 3.5vw, 2.8rem) + env(safe-area-inset-right, 0px));
      pointer-events: auto;
    }

    .status {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: titleIn 1.2s 0.3s ease both;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c45c4a;
      box-shadow: 0 0 8px rgba(196, 92, 74, 0.5);
      transition: background 0.35s, box-shadow 0.35s;
    }

    .status-dot.live {
      background: var(--accent);
      box-shadow: 0 0 10px var(--glow);
    }

    .hint {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: rgba(232, 235, 230, 0.28);
      max-width: 22rem;
      line-height: 1.55;
      animation: titleIn 1.2s 0.45s ease both;
    }

    button.toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(14, 19, 25, 0.55);
      backdrop-filter: blur(12px);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.85rem 1.15rem;
      min-height: 44px;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s, color 0.3s;
      animation: titleIn 1.2s 0.25s ease both;
      -webkit-tap-highlight-color: transparent;
    }

    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 2rem;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(18, 28, 36, 0.92) 0%, rgba(7, 9, 12, 0.96) 70%);
      text-align: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-overlay h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      letter-spacing: 0.02em;
    }

    .start-overlay p {
      max-width: 18rem;
      font-size: 0.78rem;
      line-height: 1.55;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .start-overlay button {
      appearance: none;
      border: 1px solid rgba(126, 200, 195, 0.45);
      background: rgba(126, 200, 195, 0.12);
      color: var(--accent);
      font-family: "DM Sans", sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 1rem 1.8rem;
      min-height: 48px;
      cursor: pointer;
      margin-top: 0.4rem;
    }

    button.toggle:hover {
      border-color: rgba(232, 235, 230, 0.35);
      background: rgba(20, 28, 36, 0.7);
    }

    button.toggle.on {
      border-color: rgba(126, 200, 195, 0.45);
      color: var(--accent);
    }

    #charge-ring {
      position: fixed;
      z-index: 5;
      width: 88px;
      height: 88px;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s ease;
    }

    #charge-ring.visible { opacity: 1; }

    #charge-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #charge-ring .track {
      fill: none;
      stroke: rgba(232, 235, 230, 0.12);
      stroke-width: 2;
    }

    #charge-ring .fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 251.2;
      stroke-dashoffset: 251.2;
      filter: drop-shadow(0 0 6px var(--glow));
      transition: stroke 0.2s;
    }

    #preview {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .hint { display: none; }
      header h1 { font-size: 1.75rem; }
      header p { font-size: 0.62rem; }
      .status { font-size: 0.62rem; max-width: 70vw; }
    }
  </style>
</head>
<body>
  <video id="bg-video" playsinline webkit-playsinline muted autoplay></video>
  <video id="preview" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="scene"></canvas>
  <div class="atmosphere"></div>

  <div class="start-overlay" id="startOverlay">
    <h2>Orbital Hands</h2>
    <p>Cho phép camera để điều khiển quả cầu hạt bằng cử chỉ tay. Hoạt động tốt nhất dưới ánh sáng đủ.</p>
    <button type="button" id="startBtn">Bật camera</button>
  </div>

  <header>
    <h1>Orbital Hands</h1>
    <p>Particle sphere · MediaPipe</p>
  </header>

  <div class="hud hud-top-right">
    <button class="toggle" id="webcamToggle" type="button">Webcam nền</button>
  </div>

  <div class="hud hud-bottom">
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Nhấn Bật camera để bắt đầu</span>
    </div>
    <p class="hint">Một tay di chuyển · Chụm giữ rồi thả để nổ · Hai tay phóng to/thu nhỏ · Đếm ngón đổi màu</p>
  </div>

  <div id="charge-ring">
    <svg viewBox="0 0 88 88">
      <circle class="track" cx="44" cy="44" r="40" />
      <circle class="fill" id="chargeFill" cx="44" cy="44" r="40" />
    </svg>
  </div>

  <script>
    (() => {
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
      const PARTICLE_COUNT = 3000;
      const BASE_RADIUS = 1.65;
      const PINCH_THRESHOLD = isMobile ? 0.08 : 0.065;
      const CHARGE_DURATION = 1.15;
      const CIRC = 2 * Math.PI * 40;
      const CAM_W = isMobile ? 480 : 640;
      const CAM_H = isMobile ? 360 : 480;

      const colorPalettes = [
        { a: new THREE.Color("#7ec8c3"), b: new THREE.Color("#d4ebe8") }, // 0–1
        { a: new THREE.Color("#e8b86d"), b: new THREE.Color("#f5e6c8") }, // 2
        { a: new THREE.Color("#6ea8d9"), b: new THREE.Color("#c5dff2") }, // 3
        { a: new THREE.Color("#d98b7a"), b: new THREE.Color("#f0d0c6") }, // 4
        { a: new THREE.Color("#9bb87a"), b: new THREE.Color("#dce8cb") }, // 5
        { a: new THREE.Color("#c9a0dc"), b: new THREE.Color("#ead9f2") }, // 6–10 both hands
        { a: new THREE.Color("#f0d48a"), b: new THREE.Color("#fff6d8") },
        { a: new THREE.Color("#7ad0b0"), b: new THREE.Color("#d4f5ea") },
        { a: new THREE.Color("#e07a9a"), b: new THREE.Color("#f5d0dc") },
        { a: new THREE.Color("#8ab4e8"), b: new THREE.Color("#d6e6f8") },
        { a: new THREE.Color("#ffffff"), b: new THREE.Color("#a8c4c0") },
      ];

      const canvas = document.getElementById("scene");
      const bgVideo = document.getElementById("bg-video");
      const preview = document.getElementById("preview");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const webcamToggle = document.getElementById("webcamToggle");
      const chargeRing = document.getElementById("charge-ring");
      const chargeFill = document.getElementById("chargeFill");
      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");

      preview.setAttribute("playsinline", "");
      preview.setAttribute("webkit-playsinline", "");
      bgVideo.setAttribute("playsinline", "");
      bgVideo.setAttribute("webkit-playsinline", "");

      chargeFill.style.strokeDasharray = String(CIRC);
      chargeFill.style.strokeDashoffset = String(CIRC);

      // —— Three.js ——
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.z = 6.2;

      const orbGroup = new THREE.Group();
      scene.add(orbGroup);

      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const basePositions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      const velocities = new Float32Array(PARTICLE_COUNT * 3);
      const phases = new Float32Array(PARTICLE_COUNT);
      const sizes = new Float32Array(PARTICLE_COUNT);

      function fibonacciSphere(i, n, radius) {
        const t = (i + 0.5) / n;
        const y = 1 - 2 * t;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const phi = i * 2.399963229728653;
        return [
          Math.cos(phi) * r * radius,
          y * radius,
          Math.sin(phi) * r * radius,
        ];
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const jitter = 0.92 + Math.random() * 0.16;
        const [x, y, z] = fibonacciSphere(i, PARTICLE_COUNT, BASE_RADIUS * jitter);
        const i3 = i * 3;
        basePositions[i3] = x;
        basePositions[i3 + 1] = y;
        basePositions[i3 + 2] = z;
        positions[i3] = x;
        positions[i3 + 1] = y;
        positions[i3 + 2] = z;
        phases[i] = Math.random() * Math.PI * 2;
        sizes[i] = 0.7 + Math.random() * 1.4;
        const c = colorPalettes[0].a.clone().lerp(colorPalettes[0].b, Math.random());
        colors[i3] = c.r;
        colors[i3 + 1] = c.g;
        colors[i3 + 2] = c.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
          uScale: { value: 1 },
        },
        vertexShader: `
          attribute float aSize;
          uniform float uTime;
          uniform float uPixelRatio;
          uniform float uScale;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float dist = length(mvPosition.xyz);
            float pulse = 0.85 + 0.15 * sin(uTime * 1.4 + position.x * 3.0 + position.y * 2.0);
            gl_PointSize = aSize * uScale * uPixelRatio * (180.0 / dist) * pulse;
            gl_PointSize = clamp(gl_PointSize, 1.0, 28.0);
            vAlpha = smoothstep(14.0, 3.0, dist);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float d = length(uv);
            float core = smoothstep(0.5, 0.0, d);
            float glow = exp(-d * 4.2) * 0.55;
            float alpha = (core * 0.9 + glow) * vAlpha;
            if (alpha < 0.01) discard;
            gl_FragColor = vec4(vColor, alpha);
          }
        `,
      });

      const points = new THREE.Points(geometry, material);
      orbGroup.add(points);

      // Soft core glow
      const coreGeo = new THREE.SphereGeometry(0.35, 32, 32);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0x7ec8c3,
        transparent: true,
        opacity: 0.08,
        depthWrite: false,
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      orbGroup.add(core);

      // —— State ——
      const state = {
        targetPos: new THREE.Vector3(0, 0, 0),
        currentPos: new THREE.Vector3(0, 0, 0),
        targetRot: new THREE.Euler(0, 0, 0),
        currentRot: new THREE.Euler(0, 0, 0),
        targetScale: 1,
        currentScale: 1,
        mode: "idle", // idle | one | two | charge | explode | reform
        pinchActive: false,
        charge: 0,
        explodeT: 0,
        reformT: 0,
        fingerCount: 0,
        colorIndex: 0,
        targetColorA: colorPalettes[0].a.clone(),
        targetColorB: colorPalettes[0].b.clone(),
        handsPresent: 0,
        webcamBg: false,
        lastPinchRelease: 0,
      };

      let lastFingerApply = 0;

      function countExtendedFingers(landmarks, handedness) {
        // Tips: thumb 4, index 8, middle 12, ring 16, pinky 20
        // PIPs: 3, 6, 10, 14, 18  — MCPs for thumb comparison
        let count = 0;
        const tips = [8, 12, 16, 20];
        const pips = [6, 10, 14, 18];
        for (let i = 0; i < 4; i++) {
          if (landmarks[tips[i]].y < landmarks[pips[i]].y) count++;
        }
        // Thumb: compare x relative to IP depending on hand
        const isRight = handedness === "Right";
        // Mirrored webcam: MediaPipe labels are from person's perspective
        if (isRight) {
          if (landmarks[4].x < landmarks[3].x) count++;
        } else {
          if (landmarks[4].x > landmarks[3].x) count++;
        }
        return count;
      }

      function pinchDistance(landmarks) {
        const a = landmarks[4];
        const b = landmarks[8];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dz = (a.z || 0) - (b.z || 0);
        return Math.sqrt(dx * dx + dy * dy + dz * dz);
      }

      function palmCenter(landmarks) {
        // average of wrist + MCPs
        const idxs = [0, 5, 9, 13, 17];
        let x = 0, y = 0, z = 0;
        for (const i of idxs) {
          x += landmarks[i].x;
          y += landmarks[i].y;
          z += landmarks[i].z || 0;
        }
        const n = idxs.length;
        return { x: x / n, y: y / n, z: z / n };
      }

      function handSpan(landmarks) {
        const wrist = landmarks[0];
        const mid = landmarks[12];
        const dx = wrist.x - mid.x;
        const dy = wrist.y - mid.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function setStatus(live, text) {
        statusDot.classList.toggle("live", live);
        statusText.textContent = text;
      }

      function applyColorPalette(index) {
        const p = colorPalettes[Math.min(index, colorPalettes.length - 1)];
        state.colorIndex = index;
        state.targetColorA.copy(p.a);
        state.targetColorB.copy(p.b);
        coreMat.color.copy(p.a);
      }

      function triggerExplode() {
        state.mode = "explode";
        state.explodeT = 0;
        state.charge = 0;
        state.pinchActive = false;
        chargeRing.classList.remove("visible");
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const i3 = i * 3;
          const dir = new THREE.Vector3(
            basePositions[i3],
            basePositions[i3 + 1],
            basePositions[i3 + 2]
          ).normalize();
          const speed = 2.2 + Math.random() * 5.5;
          const scatter = new THREE.Vector3(
            (Math.random() - 0.5) * 1.2,
            (Math.random() - 0.5) * 1.2,
            (Math.random() - 0.5) * 1.2
          );
          velocities[i3] = dir.x * speed + scatter.x;
          velocities[i3 + 1] = dir.y * speed + scatter.y;
          velocities[i3 + 2] = dir.z * speed + scatter.z;
        }
      }

      function startReform() {
        state.mode = "reform";
        state.reformT = 0;
      }

      function updateChargeUI(charge, screenX, screenY) {
        if (charge <= 0.01) {
          chargeRing.classList.remove("visible");
          return;
        }
        chargeRing.classList.add("visible");
        chargeRing.style.left = `${screenX}px`;
        chargeRing.style.top = `${screenY}px`;
        chargeFill.style.strokeDashoffset = String(CIRC * (1 - charge));
      }

      // —— MediaPipe ——
      let cameraUtils = null;

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`,
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: isMobile ? 0 : 1,
        minDetectionConfidence: isMobile ? 0.55 : 0.65,
        minTrackingConfidence: isMobile ? 0.45 : 0.55,
      });

      hands.onResults(onResults);

      async function startCamera() {
        try {
          setStatus(false, "Đang mở camera…");
          startBtn.disabled = true;
          startBtn.textContent = "Đang mở…";

          cameraUtils = new Camera(preview, {
            onFrame: async () => {
              if (preview.readyState >= 2) {
                await hands.send({ image: preview });
              }
            },
            width: CAM_W,
            height: CAM_H,
            facingMode: "user",
          });
          await cameraUtils.start();

          // Ensure playback on iOS
          preview.muted = true;
          bgVideo.muted = true;
          await preview.play().catch(() => {});

          if (preview.srcObject) {
            bgVideo.srcObject = preview.srcObject;
            await bgVideo.play().catch(() => {});
          }

          startOverlay.classList.add("hidden");
          setStatus(true, "Camera sẵn sàng · đưa tay vào khung hình");
        } catch (err) {
          console.error(err);
          startBtn.disabled = false;
          startBtn.textContent = "Thử lại";
          setStatus(false, "Không mở được camera — kiểm tra quyền HTTPS/camera");
        }
      }

      startBtn.addEventListener("click", () => {
        startCamera();
      });

      function onResults(results) {
        const multi = results.multiHandLandmarks || [];
        const handedness = results.multiHandedness || [];
        state.handsPresent = multi.length;

        if (multi.length === 0) {
          if (state.mode === "charge") {
            // cancelled pinch without full charge
            state.mode = "idle";
            state.pinchActive = false;
            state.charge = 0;
            chargeRing.classList.remove("visible");
          } else if (state.mode === "one" || state.mode === "two") {
            state.mode = "idle";
          }
          if (state.mode === "idle") {
            setStatus(true, "Đưa tay vào khung hình");
          }
          return;
        }

        // Explode / reform take priority visually but still accept scale/pos softly
        const exploding = state.mode === "explode" || state.mode === "reform";

        if (multi.length >= 2) {
          // Two hands: scale by distance between palms
          if (!exploding) state.mode = "two";
          state.pinchActive = false;
          state.charge = 0;
          chargeRing.classList.remove("visible");

          const c0 = palmCenter(multi[0]);
          const c1 = palmCenter(multi[1]);
          const dist = Math.hypot(c0.x - c1.x, c0.y - c1.y);
          // Map typical hand distance ~0.12–0.7 to scale 0.35–2.4
          const scale = THREE.MathUtils.clamp(
            THREE.MathUtils.mapLinear(dist, 0.1, 0.72, 0.35, 2.45),
            0.3,
            2.6
          );
          state.targetScale = scale;

          const midX = (c0.x + c1.x) * 0.5;
          const midY = (c0.y + c1.y) * 0.5;
          state.targetPos.set(
            THREE.MathUtils.mapLinear(1 - midX, 0, 1, -2.4, 2.4),
            THREE.MathUtils.mapLinear(1 - midY, 0, 1, -1.6, 1.6),
            0
          );

          let fingers = 0;
          for (let i = 0; i < multi.length; i++) {
            const label = handedness[i]?.label || "Right";
            fingers += countExtendedFingers(multi[i], label);
          }
          state.fingerCount = fingers;
          const idx = Math.min(fingers, colorPalettes.length - 1);
          if (idx !== state.colorIndex && performance.now() - lastFingerApply > 180) {
            applyColorPalette(idx);
            lastFingerApply = performance.now();
          }

          setStatus(true, `Hai tay · phóng to ${scale.toFixed(2)}× · ${fingers} ngón`);
          return;
        }

        // One hand
        const lm = multi[0];
        const label = handedness[0]?.label || "Right";
        const fingers = countExtendedFingers(lm, label);
        state.fingerCount = fingers;

        const pinch = pinchDistance(lm);
        const isPinching = pinch < PINCH_THRESHOLD;
        const palm = palmCenter(lm);

        // Screen coords for charge ring (mirrored)
        const sx = (1 - palm.x) * window.innerWidth;
        const sy = palm.y * window.innerHeight;

        if (!exploding) {
          if (isPinching) {
            if (!state.pinchActive) {
              state.pinchActive = true;
              state.charge = 0;
              state.mode = "charge";
            }
          } else {
            if (state.pinchActive && state.mode === "charge") {
              if (state.charge >= 0.98) {
                triggerExplode();
                setStatus(true, "Phát nổ!");
              } else {
                state.mode = "one";
                state.charge = 0;
                chargeRing.classList.remove("visible");
              }
              state.pinchActive = false;
            }
          }
        }

        if (state.mode !== "charge" && state.mode !== "explode" && state.mode !== "reform") {
          state.mode = "one";
        }

        // Position & rotation from one hand
        state.targetPos.set(
          THREE.MathUtils.mapLinear(1 - palm.x, 0, 1, -2.6, 2.6),
          THREE.MathUtils.mapLinear(1 - palm.y, 0, 1, -1.8, 1.8),
          THREE.MathUtils.mapLinear(-(palm.z || 0), -0.2, 0.2, -0.8, 0.8)
        );

        // Rotation from wrist→middle MCP vector and index tip
        const wrist = lm[0];
        const middle = lm[9];
        const index = lm[5];
        const yaw = Math.atan2(middle.x - wrist.x, middle.y - wrist.y);
        const pitch = (index.z - wrist.z) * 4;
        const roll = (lm[17].x - lm[5].x) * 3.5;
        state.targetRot.set(pitch * 0.9, -yaw * 1.1, roll);

        // Soft idle scale when one hand
        if (state.mode === "one" || state.mode === "charge") {
          const span = handSpan(lm);
          state.targetScale = THREE.MathUtils.clamp(
            THREE.MathUtils.mapLinear(span, 0.12, 0.42, 0.75, 1.35),
            0.55,
            1.6
          );
        }

        if (performance.now() - lastFingerApply > 180) {
          const idx = Math.min(Math.max(fingers, 0), colorPalettes.length - 1);
          if (idx !== state.colorIndex) {
            applyColorPalette(idx);
            lastFingerApply = performance.now();
          }
        }

        if (state.mode === "charge") {
          setStatus(true, `Đang sạc ${(state.charge * 100).toFixed(0)}% · giữ chụm`);
          updateChargeUI(state.charge, sx, sy);
        } else if (!exploding) {
          setStatus(true, `Một tay · ${fingers} ngón · màu ${state.colorIndex}`);
        }
      }

      webcamToggle.addEventListener("click", () => {
        state.webcamBg = !state.webcamBg;
        bgVideo.classList.toggle("active", state.webcamBg);
        document.body.classList.toggle("webcam-bg", state.webcamBg);
        webcamToggle.classList.toggle("on", state.webcamBg);
        webcamToggle.textContent = state.webcamBg ? "Ẩn webcam" : "Webcam nền";
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2);
      });

      // Prevent iOS rubber-band scroll
      document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

      // —— Animation ——
      const clock = new THREE.Clock();
      let idleAngle = 0;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;
        material.uniforms.uTime.value = t;

        // Charge progress
        if (state.mode === "charge" && state.pinchActive) {
          state.charge = Math.min(1, state.charge + dt / CHARGE_DURATION);
          // Pulse scale while charging
          state.targetScale = 1 + state.charge * 0.25;
        }

        // Smooth transforms
        const lerpPos = state.handsPresent ? 6 : 1.8;
        const lerpRot = state.handsPresent ? 5 : 1.2;
        const lerpScale = 4.5;

        state.currentPos.lerp(state.targetPos, 1 - Math.exp(-lerpPos * dt));
        state.currentRot.x = THREE.MathUtils.lerp(
          state.currentRot.x,
          state.targetRot.x,
          1 - Math.exp(-lerpRot * dt)
        );
        state.currentRot.y = THREE.MathUtils.lerp(
          state.currentRot.y,
          state.targetRot.y,
          1 - Math.exp(-lerpRot * dt)
        );
        state.currentRot.z = THREE.MathUtils.lerp(
          state.currentRot.z,
          state.targetRot.z,
          1 - Math.exp(-lerpRot * dt)
        );
        state.currentScale = THREE.MathUtils.lerp(
          state.currentScale,
          state.targetScale,
          1 - Math.exp(-lerpScale * dt)
        );

        if (!state.handsPresent && state.mode === "idle") {
          idleAngle += dt * 0.35;
          state.targetPos.set(
            Math.sin(idleAngle * 0.7) * 0.25,
            Math.cos(idleAngle * 0.55) * 0.15,
            0
          );
          state.targetRot.y = idleAngle * 0.4;
          state.targetRot.x = Math.sin(idleAngle * 0.3) * 0.15;
          state.targetScale = 1;
        }

        orbGroup.position.copy(state.currentPos);
        orbGroup.rotation.set(
          state.currentRot.x,
          state.currentRot.y,
          state.currentRot.z
        );
        orbGroup.scale.setScalar(state.currentScale);
        material.uniforms.uScale.value = 0.85 + state.currentScale * 0.2;

        // Particle simulation
        const posAttr = geometry.attributes.position;
        const colAttr = geometry.attributes.color;
        const arr = posAttr.array;
        const col = colAttr.array;

        if (state.mode === "explode") {
          state.explodeT += dt;
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            arr[i3] += velocities[i3] * dt;
            arr[i3 + 1] += velocities[i3 + 1] * dt;
            arr[i3 + 2] += velocities[i3 + 2] * dt;
            velocities[i3] *= 0.985;
            velocities[i3 + 1] *= 0.985;
            velocities[i3 + 2] *= 0.985;
            velocities[i3 + 1] -= 1.8 * dt; // gravity
          }
          posAttr.needsUpdate = true;
          if (state.explodeT > 1.35) startReform();
        } else if (state.mode === "reform") {
          state.reformT += dt;
          const k = 1 - Math.exp(-3.2 * dt);
          let maxDist = 0;
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            const bx = basePositions[i3];
            const by = basePositions[i3 + 1];
            const bz = basePositions[i3 + 2];
            // breathe while reforming
            const breath = 1 + Math.sin(t * 3 + phases[i]) * 0.02 * (1 - Math.min(1, state.reformT));
            const tx = bx * breath;
            const ty = by * breath;
            const tz = bz * breath;
            arr[i3] += (tx - arr[i3]) * k;
            arr[i3 + 1] += (ty - arr[i3 + 1]) * k;
            arr[i3 + 2] += (tz - arr[i3 + 2]) * k;
            const dx = arr[i3] - bx;
            const dy = arr[i3 + 1] - by;
            const dz = arr[i3 + 2] - bz;
            maxDist = Math.max(maxDist, dx * dx + dy * dy + dz * dz);
          }
          posAttr.needsUpdate = true;
          if (state.reformT > 1.8 || maxDist < 0.004) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
              const i3 = i * 3;
              arr[i3] = basePositions[i3];
              arr[i3 + 1] = basePositions[i3 + 1];
              arr[i3 + 2] = basePositions[i3 + 2];
            }
            posAttr.needsUpdate = true;
            state.mode = state.handsPresent ? (state.handsPresent >= 2 ? "two" : "one") : "idle";
            setStatus(true, state.handsPresent ? "Quả cầu đã tái tạo" : "Đưa tay vào khung hình");
          }
        } else {
          // Idle breathing / slight noise on sphere surface
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            const breathe =
              1 +
              Math.sin(t * 1.1 + phases[i]) * 0.018 +
              Math.sin(t * 2.3 + phases[i] * 2) * 0.008;
            const chargePulse =
              state.mode === "charge"
                ? 1 + state.charge * 0.12 * Math.sin(t * 12 + phases[i])
                : 1;
            arr[i3] = basePositions[i3] * breathe * chargePulse;
            arr[i3 + 1] = basePositions[i3 + 1] * breathe * chargePulse;
            arr[i3 + 2] = basePositions[i3 + 2] * breathe * chargePulse;
          }
          posAttr.needsUpdate = true;
        }

        // Color lerp toward palette
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const i3 = i * 3;
          const mix = (Math.sin(phases[i] * 3 + i * 0.01) + 1) * 0.5;
          const tr =
            state.targetColorA.r * (1 - mix) + state.targetColorB.r * mix;
          const tg =
            state.targetColorA.g * (1 - mix) + state.targetColorB.g * mix;
          const tb =
            state.targetColorA.b * (1 - mix) + state.targetColorB.b * mix;
          col[i3] += (tr - col[i3]) * (1 - Math.exp(-4 * dt));
          col[i3 + 1] += (tg - col[i3 + 1]) * (1 - Math.exp(-4 * dt));
          col[i3 + 2] += (tb - col[i3 + 2]) * (1 - Math.exp(-4 * dt));
        }
        colAttr.needsUpdate = true;

        core.material.opacity =
          0.06 +
          (state.mode === "charge" ? state.charge * 0.2 : 0) +
          Math.sin(t * 1.5) * 0.02;

        renderer.render(scene, camera);
      }

      // Wait for user tap (required on iOS/mobile)
      animate();
    })();
  </script>
</body>
</html>
